<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dion Prayoga — Sales Honda Bandung</title>
<meta name="description" content="Katalog Honda Daya Motor Cibiru, Bandung. Cek stok, simulasi kredit, atau booking test ride.">
<meta name="theme-color" content="#1c1c1e">
<style>
:root{
  --bg:#f5f5f7;
  --bg-glass:rgba(245,245,247,0.75);
  --surface:#ffffff;
  --surface-2:#fafafa;

  --label:#1d1d1f;
  --label-2:#6e6e73;
  --label-3:#86868b;

  --separator:rgba(60,60,67,0.08);
  --fill:rgba(120,120,128,0.08);
  --fill-2:rgba(120,120,128,0.12);

  --accent:#ff9500;
  --accent-2:#f58a00;
  --accent-text:#1c1c1e;
  --accent-soft:rgba(255,149,0,0.12);

  --wa:#25d366;
  --wa-2:#1da851;
  --wa-glass:rgba(37,211,102,0.9);

  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-float:0 8px 24px rgba(37,211,102,.35),0 2px 8px rgba(0,0,0,.1);

  --radius-card:20px;
  --radius-button:14px;
  --radius-pill:999px;

  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --smooth:cubic-bezier(0.4,0,0.2,1);
  --nav-duration:400ms;
  --nav-easing:cubic-bezier(0.32,0.72,0,1);

  --blur-glass:blur(24px) saturate(180%);
  --blur-glass-sm:blur(20px) saturate(180%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;color:var(--label);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden}
button,a{touch-action:manipulation}

/* SCREEN SYSTEM */
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear var(--nav-duration);
  padding-bottom:120px;
}
.screen.is-active{
  transform:translateX(0);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-28%);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen.is-active .anim-in{animation:fadeInUp .5s var(--smooth) both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.wrap{max-width:520px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}

/* SPINNER */
.is-loading{pointer-events:none;position:relative;color:transparent!important}
.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
.wa-btn.is-loading::after,.wa-btn.is-loading{color:transparent}
.wa-btn.is-loading::after{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.hero-cta.is-loading{color:transparent!important}
.hero-cta.is-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--label)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ HERO ============ */
.hero{
  background:
    radial-gradient(ellipse at 85% 0%,rgba(255,149,0,0.22) 0%,transparent 55%),
    radial-gradient(ellipse at 0% 100%,rgba(255,100,0,0.12) 0%,transparent 50%),
    linear-gradient(180deg,#1c1c1e 0%,#2c2c2e 100%);
  color:#fff;
  padding:calc(20px + env(safe-area-inset-top)) 0 28px;
  position:relative;overflow:hidden;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
}
.hero-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:22px;
}
.hero-profile{
  display:flex;align-items:center;gap:11px;min-width:0;flex:1;
}
.profile-avatar{
  width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#ffb84d 0%,#ff8500 100%);
  color:#fff;display:grid;place-items:center;
  font-size:19px;font-weight:800;flex-shrink:0;position:relative;
  box-shadow:0 2px 8px rgba(255,149,0,.3),
             inset 0 0 0 1px rgba(255,255,255,.15);
}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0}
.profile-info strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-0.01em;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.profile-info span{
  display:block;font-size:12px;color:rgba(255,255,255,0.6);
  margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  padding:5px 10px;border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;flex-shrink:0;
  backdrop-filter:var(--blur-glass-sm);
  -webkit-backdrop-filter:var(--blur-glass-sm);
}
.badge .dot{
  width:6px;height:6px;border-radius:50%;background:#4ade80;
  box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}
  70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}
.hero h1{
  font-size:28px;line-height:1.15;font-weight:800;
  letter-spacing:-0.03em;margin-bottom:10px;
}
.hero p{font-size:14.5px;color:rgba(255,255,255,.7);margin-bottom:22px;line-height:1.5}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;background:var(--accent);color:var(--accent-text);
  font-weight:700;font-size:16px;letter-spacing:-0.01em;
  padding:17px;border-radius:var(--radius-button);
  box-shadow:0 4px 12px rgba(255,149,0,0.3),0 1px 2px rgba(0,0,0,0.15);
  transition:transform .2s var(--spring),background .15s;
  cursor:pointer;position:relative;
}
.hero-cta:active{transform:scale(.97);background:var(--accent-2)}

/* ============ SECTIONS WITH STICKY GLASS HEADER ============ */
section{padding:8px 0 0}
.section-head{
  position:sticky;top:0;z-index:5;
  padding:20px 20px 14px;
  margin:0 -20px 10px;
  background:var(--bg-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  transition:box-shadow .2s ease;
}
.section-head.is-stuck{
  box-shadow:0 1px 0 rgba(60,60,67,0.08);
}
.section-title{
  font-size:20px;font-weight:800;letter-spacing:-0.02em;
  margin-bottom:4px;color:var(--label);
}
.section-sub{font-size:13.5px;color:var(--label-2);margin:0}

/* ============ SOCIAL ============ */
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.social{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);
  cursor:pointer;
}
.social:active{transform:scale(.94)}
.social-icon{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;color:#fff;
}
.social-icon svg{width:20px;height:20px}
.social-tiktok .social-icon{background:#000}
.social-ig .social-icon{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social-yt .social-icon{background:#ff0000}
.social span{
  font-size:11.5px;font-weight:600;color:var(--label);
  text-align:center;line-height:1.2;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ============ ACTIONS ============ */
.actions{display:grid;gap:10px;padding:0 20px;margin:0 -20px}
.action{
  display:flex;align-items:center;gap:14px;padding:16px;
  border-radius:var(--radius-card);background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);cursor:pointer;
}
.action:active{transform:scale(.98)}
.action-ico{
  width:46px;height:46px;border-radius:13px;
  background:var(--accent-soft);
  display:grid;place-items:center;font-size:22px;flex-shrink:0;
}
.action-body{flex:1;min-width:0}
.action-body strong{
  display:block;font-size:15.5px;font-weight:700;
  letter-spacing:-0.01em;color:var(--label);
}
.action-body span{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.action-arrow{color:var(--label-3);font-size:20px;font-weight:300}

/* ============ MODELS ============ */
.models{display:grid;gap:14px;padding:0 20px;margin:0 -20px}
.model{
  border-radius:var(--radius-card);background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);cursor:pointer;display:block;
}
.model:active{transform:scale(.98)}
.model-img{
  height:155px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);
  font-size:60px;
}
.model-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-img .tag{
  position:absolute;top:12px;left:12px;
  background:rgba(255,149,0,0.82);
  backdrop-filter:var(--blur-glass-sm);
  -webkit-backdrop-filter:var(--blur-glass-sm);
  color:#fff;
  font-size:11px;font-weight:800;padding:6px 12px;
  border-radius:var(--radius-pill);letter-spacing:0.04em;
  z-index:2;
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 2px 6px rgba(255,149,0,.25);
}
.model-img .tag.tag-dark{
  background:rgba(28,28,30,0.78);
  border-color:rgba(255,255,255,0.15);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.model-body{padding:16px 18px 18px}
.model-body h3{
  font-size:17px;font-weight:800;letter-spacing:-0.02em;
  margin-bottom:4px;color:var(--label);
}
.model-body p{font-size:13px;color:var(--label-2);margin-bottom:14px;line-height:1.5}
.model-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);color:var(--accent-text);
  font-weight:700;font-size:13.5px;letter-spacing:-0.01em;
  padding:12px 16px;border-radius:11px;
  width:100%;justify-content:center;
  transition:background .15s;
}
.model:active .model-btn{background:var(--accent-2)}

/* ============ TRUST ============ */
.trust{
  background:var(--surface);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);overflow:hidden;
  padding:0 20px;margin:0 -20px;
}
.trust-item{
  display:flex;gap:14px;align-items:flex-start;
  padding:16px 0;
}
.trust-item + .trust-item{border-top:1px solid var(--separator)}
.trust-ico{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;
  font-size:14px;font-weight:800;flex-shrink:0;
}
.trust-item strong{
  display:block;font-size:14.5px;font-weight:700;
  letter-spacing:-0.01em;color:var(--label);
}
.trust-item span{display:block;font-size:13px;color:var(--label-2);margin-top:3px;line-height:1.45}

/* ============ TERMS ============ */
.terms{
  background:var(--surface);border-radius:var(--radius-card);
  padding:16px 18px;box-shadow:var(--shadow-card);
  margin:0 20px;
}
.terms h3{
  font-size:13px;font-weight:700;color:var(--label);
  letter-spacing:-0.01em;margin-bottom:8px;
}
.terms p{
  font-size:12.5px;color:var(--label-2);line-height:1.55;
}

/* ============ DETAIL HEADER (glass) ============ */
.detail-header{
  position:sticky;top:0;z-index:10;
  background:var(--bg-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  border-bottom:1px solid var(--separator);
  display:flex;align-items:center;padding:10px 14px;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.back-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--fill);
  border:none;display:grid;place-items:center;cursor:pointer;
  color:var(--label);transition:transform .2s var(--spring),background .15s;
  flex-shrink:0;
  backdrop-filter:var(--blur-glass-sm);
  -webkit-backdrop-filter:var(--blur-glass-sm);
}
.back-btn:active{background:var(--fill-2);transform:scale(.93)}
.detail-title{
  flex:1;font-size:16px;font-weight:700;text-align:center;
  letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--label);
}

/* ============ MODEL DETAIL ============ */
.model-hero{
  height:260px;display:grid;place-items:center;position:relative;
  overflow:hidden;background:linear-gradient(135deg,#fafafa,#eaeaec);
  font-size:110px;
}
.model-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-hero .tag{
  position:absolute;top:20px;left:20px;
  background:rgba(255,149,0,0.82);
  backdrop-filter:var(--blur-glass-sm);
  -webkit-backdrop-filter:var(--blur-glass-sm);
  color:#fff;
  font-size:12px;font-weight:800;padding:7px 14px;
  border-radius:var(--radius-pill);z-index:2;
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 2px 8px rgba(255,149,0,.25);
}
.model-hero .tag.tag-dark{
  background:rgba(28,28,30,0.78);
  border-color:rgba(255,255,255,0.15);
}
.detail-h2{
  font-size:28px;font-weight:800;letter-spacing:-0.03em;
  margin-bottom:6px;color:var(--label);
}
.detail-tagline{
  font-size:15px;color:var(--accent-2);font-weight:600;
  margin-bottom:16px;letter-spacing:-0.01em;
}
.detail-desc{font-size:15px;color:var(--label-2);margin-bottom:24px;line-height:1.55}
.detail-h3{
  font-size:17px;font-weight:800;margin-bottom:12px;
  letter-spacing:-0.02em;color:var(--label);
}
.highlights{
  list-style:none;background:var(--surface);
  border-radius:var(--radius-card);padding:0;
  margin-bottom:24px;box-shadow:var(--shadow-card);overflow:hidden;
}
.highlights li{
  font-size:14.5px;color:var(--label);padding:14px 18px;
  display:flex;gap:12px;align-items:flex-start;line-height:1.45;
}
.highlights li + li{border-top:1px solid var(--separator)}
.highlights li::before{
  content:"✓";color:var(--accent);font-weight:800;flex-shrink:0;
  width:20px;height:20px;border-radius:50%;
  background:var(--accent-soft);display:grid;place-items:center;
  font-size:12px;margin-top:1px;
}
.cta-block{display:grid;gap:10px;margin-bottom:24px}
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--wa);color:#fff;font-weight:700;font-size:15.5px;
  letter-spacing:-0.01em;padding:16px;border-radius:var(--radius-button);
  transition:transform .2s var(--spring),background .15s;
  cursor:pointer;text-align:center;
  box-shadow:0 4px 12px rgba(37,211,102,.2),0 1px 2px rgba(0,0,0,0.08);
  position:relative;
}
.wa-btn:active{background:var(--wa-2);transform:scale(.97)}
.wa-btn-outline{
  background:var(--surface);color:var(--label);
  box-shadow:var(--shadow-card);
}
.wa-btn-outline:active{background:var(--surface-2)}

/* ============ FLOAT WA (glass) ============ */
.float-wa{
  position:fixed;right:20px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:50%;
  background:var(--wa-glass);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  color:#fff;
  display:grid;place-items:center;
  box-shadow:var(--shadow-float),
             inset 0 0 0 1px rgba(255,255,255,0.2);
  z-index:100;
  cursor:pointer;
  transform-origin:center bottom;
  transition:
    transform .45s var(--spring),
    opacity .35s var(--smooth),
    box-shadow .2s var(--smooth);
}
.float-wa:active{transform:scale(.9)}
.float-wa svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15))}
.float-wa.is-hidden{
  opacity:0;
  transform:scale(.6) translateY(24px);
  pointer-events:none;
  box-shadow:none;
}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;
  bottom:calc(100px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,0.82);
  backdrop-filter:var(--blur-glass);
  -webkit-backdrop-filter:var(--blur-glass);
  color:#fff;padding:13px 22px;border-radius:var(--radius-pill);
  font-size:13.5px;font-weight:600;letter-spacing:-0.01em;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--smooth),transform .3s var(--spring);
  z-index:200;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.25),
             inset 0 0 0 1px rgba(255,255,255,0.08);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{
  text-align:center;padding:40px 0 20px;
  font-size:12px;color:var(--label-3);
}
.not-found{padding:80px 24px;text-align:center}
.not-found h2{font-size:22px;margin-bottom:12px;color:var(--label);letter-spacing:-0.02em}
.not-found p{color:var(--label-2);margin-bottom:20px;font-size:14px}

/* Fallback untuk browser tanpa backdrop-filter */
@supports not ((backdrop-filter:blur(24px)) or (-webkit-backdrop-filter:blur(24px))){
  .section-head{background:var(--bg)}
  .detail-header{background:var(--bg)}
  .float-wa{background:var(--wa)}
  .toast{background:rgba(28,28,30,0.95)}
  .model-img .tag{background:var(--accent)}
  .model-img .tag.tag-dark{background:var(--label)}
  .badge{background:rgba(255,255,255,0.16)}
}
</style>

</a>

const NAV_DURATION = 400;

const waLink = msg => 'https://wa.me/' + CONFIG.phone + '?text=' + encodeURIComponent(msg || CONFIG.defaultMessage);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function openWa(msg, btnEl) {
  if (btnEl && btnEl.classList.contains('is-loading')) return;
  if (btnEl) btnEl.classList.add('is-loading');
  setTimeout(() => {
    window.open(waLink(msg), '_blank', 'noopener');
    if (btnEl) setTimeout(() => btnEl.classList.remove('is-loading'), 250);
  }, 320);
}

function imgTag(src, alt) {
  if (!src) return '';
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`;
}

function updateFloatWa(screen) {
  if (!floatWa || !screen) return;
  const hero = screen.querySelector('.hero');
  if (!hero) {
    floatWa.classList.remove('is-hidden');
    return;
  }
  const heroBottom = hero.getBoundingClientRect().bottom;
  if (heroBottom > 20) {
    floatWa.classList.add('is-hidden');
  } else {
    floatWa.classList.remove('is-hidden');
  }
}

/* Sticky header: toggle .is-stuck saat scroll */
function setupStickyHeads(screen) {
  const heads = screen.querySelectorAll('.section-head');
  if (!heads.length) return;
  const onScroll = () => {
    if (!screen.classList.contains('is-active')) return;
    heads.forEach(head => {
      const rect = head.getBoundingClientRect();
      // stuck kalau top-nya persis di 0 (dalam toleransi 1px)
      const stuck = rect.top <= 1 && rect.top >= -1;
      head.classList.toggle('is-stuck', stuck);
    });
  };
  screen.addEventListener('scroll', onScroll, { passive: true });
  if (!screen._stickyHandlers) screen._stickyHandlers = [];
  screen._stickyHandlers.push(onScroll);
}

function renderRoute(route) {
  if (route === '/') return renderHome();
  if (route.indexOf('/model/') === 0) return renderModelDetail(route.slice(7));

  if (route === '/kredit') return renderKredit();
  return renderNotFound();
}

/* NAVIGATION */
function makeScreen(route) {
  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.route = route;
  el.innerHTML = renderRoute(route);
  const onScroll = () => {
    if (!el.classList.contains('is-active')) return;
    updateFloatWa(el);
  };
  el.addEventListener('scroll', onScroll, { passive: true });
  el._onScroll = onScroll;
  setupStickyHeads(el);
  return el;
}

function pushScreen(route, animate) {
  if (animate && animating) return;
  const current = stack[stack.length - 1];
  const el = makeScreen(route);
  app.appendChild(el);

  if (animate && current) {
    animating = true;
    void el.offsetWidth;
    current.classList.remove('is-active');
    current.classList.add('is-behind');
    el.classList.add('is-active');
    setTimeout(() => {
      animating = false;
      updateFloatWa(el);
    }, NAV_DURATION);
  } else if (animate) {
    animating = true;
    el.classList.add('is-active');
    setTimeout(() => {
      animating = false;
      updateFloatWa(el);
    }, NAV_DURATION);
  } else {
    el.classList.add('no-transition', 'is-active');
    requestAnimationFrame(() => {
      el.classList.remove('no-transition');
      updateFloatWa(el);
    });
  }
  stack.push(el);
}

function popScreen(animate) {
  if (animate && animating) return;
  if (stack.length <= 1) return;
  const current = stack.pop();
  const prev = stack[stack.length - 1];
  if (animate) {
    animating = true;
    current.classList.remove('is-active');
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    setTimeout(() => {
      if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
      current.remove();
      animating = false;
      updateFloatWa(prev);
    }, NAV_DURATION);
  } else {
    if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
    current.remove();
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    updateFloatWa(prev);
  }
}

function navigate(route) {
  if (animating) return;
  const current = stack[stack.length - 1];
  if (current && current.dataset.route === route) return;
  history.pushState({ index: stack.length, route }, '', '#' + route);
  pushScreen(route, true);
}

/* EVENTS */
app.addEventListener('click', e => {
  if (animating) return;
  const navEl = e.target.closest('[data-nav]');
  if (navEl) { e.preventDefault(); navigate(navEl.dataset.nav); return; }
  const backEl = e.target.closest('[data-back]');
  if (backEl) { e.preventDefault(); if (stack.length > 1) history.back(); return; }
  const msgEl = e.target.closest('[data-msg]');
  if (msgEl) { e.preventDefault(); openWa(msgEl.dataset.msg, msgEl); return; }
});

floatWa.addEventListener('click', e => {
  e.preventDefault();
  openWa(CONFIG.defaultMessage, e.currentTarget);
});

window.addEventListener('popstate', e => {
  const state = e.state || { index: 0, route: '/' };
  const targetIndex = state.index;
  const currentIndex = stack.length - 1;
  if (targetIndex === currentIndex) return;
  if (targetIndex < currentIndex) popScreen(true);
  else if (state.route) pushScreen(state.route, true);
});

/* INIT */
(function init() {
  const initialRoute = location.hash.slice(1) || '/';
  history.replaceState({ index: 0, route: '/' }, '', '#/');
  const homeEl = makeScreen('/');
  homeEl.classList.add('no-transition', 'is-active');
  app.appendChild(homeEl);
  stack.push(homeEl);
  if (initialRoute !== '/' && initialRoute !== '') {
    history.pushState({ index: 1, route: initialRoute }, '', '#' + initialRoute);
    const detailEl = makeScreen(initialRoute);
    detailEl.classList.add('no-transition', 'is-active');
    homeEl.classList.remove('is-active');
    homeEl.classList.add('is-behind');
    app.appendChild(detailEl);
    stack.push(detailEl);
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(detailEl);
    });
  } else {
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(homeEl);
    });
  }
})();
</script>
