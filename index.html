<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dion Prayoga — Sales Honda Bandung</title>
<meta name="theme-color" content="#1c1c1e">
<style>
:root{
  --bg:#f2f2f7;
  --bg-glass:rgba(242,242,247,0.82);
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --label:#1c1c1e;
  --label-2:#6b6b70;
  --label-3:#8e8e93;
  --separator:rgba(60,60,67,0.06);
  --fill:rgba(120,120,128,0.08);
  --fill-2:rgba(120,120,128,0.14);
  --accent:#ff9f0a;
  --accent-2:#ff8c00;
  --accent-text:#1c1c1e;
  --accent-soft:rgba(255,159,10,0.14);
  --wa:#25d366;
  --wa-2:#1da851;
  --wa-glass:rgba(37,211,102,0.88);
  --glass-blur:blur(24px) saturate(180%);
  --glass-blur-sm:blur(16px) saturate(180%);
  --glass-border:rgba(255,255,255,0.55);
  --glass-border-dark:rgba(255,255,255,0.12);
  --shadow-liquid:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 1px 2px rgba(0,0,0,0.03),
    0 4px 12px rgba(0,0,0,0.04),
    0 16px 32px rgba(0,0,0,0.05);
  --shadow-liquid-sm:
    inset 0 1px 0 rgba(255,255,255,0.85),
    0 1px 2px rgba(0,0,0,0.03),
    0 8px 20px rgba(0,0,0,0.05);
  --shadow-float:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 8px 24px rgba(37,211,102,.4),
    0 2px 8px rgba(0,0,0,.12);
  --radius-card:24px;
  --radius-button:16px;
  --radius-pill:999px;
  --radius-hero:32px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --nav-duration:400ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;color:var(--label);
  background:
    radial-gradient(ellipse at 15% 5%,rgba(255,159,10,0.05) 0%,transparent 45%),
    radial-gradient(ellipse at 85% 95%,rgba(88,86,214,0.04) 0%,transparent 40%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden}
button,a{touch-action:manipulation}

.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;background:transparent;
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear var(--nav-duration);
  padding-bottom:120px;
}
.screen.is-active{
  transform:translateX(0);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-28%);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen.is-active .anim-in{animation:fadeInUp .5s var(--smooth) both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.wrap{max-width:520px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}

.is-loading{pointer-events:none;position:relative;color:transparent!important}
.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
.wa-btn.is-loading::after,.wa-btn.is-loading{color:transparent}
.wa-btn.is-loading::after{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.hero-cta.is-loading{color:transparent!important}
.hero-cta.is-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--label)}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{
  background:
    radial-gradient(ellipse at 75% 15%,rgba(255,159,10,0.28) 0%,transparent 50%),
    radial-gradient(ellipse at 15% 85%,rgba(255,120,0,0.15) 0%,transparent 45%),
    linear-gradient(180deg,#1c1c1e 0%,#2c2c2e 100%);
  color:#fff;padding:calc(22px + env(safe-area-inset-top)) 0 30px;
  position:relative;overflow:hidden;
  border-bottom-left-radius:var(--radius-hero);
  border-bottom-right-radius:var(--radius-hero);
  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.12);
}
.hero::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,0.08) 0%,transparent 55%);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;position:relative}
.hero-profile{display:flex;align-items:center;gap:12px;min-width:0;flex:1;position:relative}
.profile-avatar{
  width:48px;height:48px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#ffb84d 0%,#ff8500 100%);
  color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;
  flex-shrink:0;position:relative;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 4px 12px rgba(255,159,10,.35);
}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0}
.profile-info strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-info span{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.1);
  border:0.5px solid rgba(255,255,255,0.18);
  padding:6px 11px;border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h1{font-size:29px;line-height:1.12;font-weight:800;letter-spacing:-.035em;margin-bottom:10px;position:relative}
.hero p{font-size:14.5px;color:rgba(255,255,255,.72);margin-bottom:24px;line-height:1.5;position:relative}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  padding:18px;border-radius:var(--radius-button);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 1px 2px rgba(0,0,0,0.1),
    0 4px 12px rgba(255,159,10,0.35),
    0 12px 32px rgba(255,159,10,0.25);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;position:relative;
}
.hero-cta:active{
  transform:scale(.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 1px 2px rgba(0,0,0,0.1),
    0 2px 6px rgba(255,159,10,0.3);
}

section{padding:8px 0 0}
.section-head{
  position:sticky;top:0;z-index:5;
  padding:22px 20px 14px;margin:0 -20px 12px;
  background:rgba(242,242,247,0.75);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 -0.5px 0 rgba(60,60,67,0.08);
  transition:box-shadow .2s ease;
}
.section-head.is-stuck{
  box-shadow:
    inset 0 -0.5px 0 rgba(60,60,67,0.08),
    0 1px 12px rgba(0,0,0,0.03);
}
.section-title{font-size:21px;font-weight:800;letter-spacing:-.025em;margin-bottom:4px;color:var(--label)}
.section-sub{font-size:13.5px;color:var(--label-2);margin:0;letter-spacing:-.005em}

.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.social{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 8px;border-radius:18px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
  transition:transform .2s var(--spring);
  cursor:pointer;
}
.social:active{transform:scale(.94)}
.social-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.social-icon svg{width:21px;height:21px}
.social-tiktok .social-icon{background:#000}
.social-ig .social-icon{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social-yt .social-icon{background:#ff0000}
.social span{font-size:11.5px;font-weight:600;color:var(--label);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.actions{display:grid;gap:10px}
.action{
  display:flex;align-items:center;gap:15px;padding:17px;
  border-radius:var(--radius-card);
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
  transition:transform .2s var(--spring);
  cursor:pointer;
}
.action:active{transform:scale(.98)}
.action-ico{
  width:48px;height:48px;border-radius:14px;
  background:var(--accent-soft);
  display:grid;place-items:center;font-size:23px;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
}
.action-body{flex:1;min-width:0}
.action-body strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.015em;color:var(--label)}
.action-body span{display:block;font-size:13px;color:var(--label-2);margin-top:3px;letter-spacing:-.005em}
.action-arrow{color:var(--label-3);font-size:22px;font-weight:300}

.models{display:grid;gap:14px}
.model{
  border-radius:var(--radius-card);overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
  transition:transform .2s var(--spring);
  cursor:pointer;display:block;
}
.model:active{transform:scale(.98)}
.model-img{
  height:160px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);font-size:62px;
}
.model-img::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0.04) 0%,transparent 30%,transparent 70%,rgba(0,0,0,0.02) 100%);
}
.model-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-img .tag{
  position:absolute;top:14px;left:14px;
  background:rgba(255,159,10,0.92);
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:11px;font-weight:800;padding:6px 12px;
  border-radius:var(--radius-pill);letter-spacing:.04em;z-index:2;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 2px 8px rgba(255,159,10,.35);
}
.model-img .tag.tag-dark{
  background:rgba(28,28,30,0.85);
  border-color:rgba(255,255,255,0.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 2px 8px rgba(0,0,0,.25);
}
.model-body{padding:17px 19px 19px}
.model-body h3{font-size:17.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px;color:var(--label)}
.model-body p{font-size:13px;color:var(--label-2);margin-bottom:12px;line-height:1.5}
.model-body .model-price{
  font-size:14.5px;font-weight:700;color:var(--accent-2);
  margin-bottom:14px;letter-spacing:-.015em;
}
.model-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  font-weight:700;font-size:13.5px;letter-spacing:-.015em;
  padding:12px 16px;border-radius:12px;
  width:100%;justify-content:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 2px 6px rgba(255,159,10,.25);
  transition:transform .15s,box-shadow .15s;
}
.model:active .model-btn{
  transform:scale(.98);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4);
}

.trust{
  border-radius:var(--radius-card);overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
}
.trust-item{display:flex;gap:15px;align-items:flex-start;padding:17px 19px}
.trust-item + .trust-item{border-top:0.5px solid var(--separator)}
.trust-ico{
  width:36px;height:36px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.trust-item strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--label)}
.trust-item span{display:block;font-size:13px;color:var(--label-2);margin-top:4px;line-height:1.5}

.terms{
  border-radius:var(--radius-card);padding:17px 19px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
}
.terms h3{font-size:13px;font-weight:700;color:var(--label);letter-spacing:-.01em;margin-bottom:8px}
.terms p{font-size:12.5px;color:var(--label-2);line-height:1.6}

.detail-header{
  position:sticky;top:0;z-index:10;
  background:rgba(242,242,247,0.78);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 -0.5px 0 rgba(60,60,67,0.08);
  display:flex;align-items:center;padding:10px 14px;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.back-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(120,120,128,0.1);
  border:0.5px solid rgba(255,255,255,0.4);
  display:grid;place-items:center;cursor:pointer;
  color:var(--label);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 1px 3px rgba(0,0,0,.05);
  transition:transform .2s var(--spring),background .15s;
  flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
}
.back-btn:active{background:rgba(120,120,128,0.18);transform:scale(.93)}
.detail-title{
  flex:1;font-size:16.5px;font-weight:700;text-align:center;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label);
}

.model-hero{
  height:270px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);font-size:112px;
}
.model-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-hero .tag{
  position:absolute;top:22px;left:22px;
  background:rgba(255,159,10,0.92);
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:12px;font-weight:800;padding:7px 14px;
  border-radius:var(--radius-pill);z-index:2;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 2px 10px rgba(255,159,10,.3);
}
.model-hero .tag.tag-dark{background:rgba(28,28,30,0.85);border-color:rgba(255,255,255,0.18)}
.detail-h2{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;color:var(--label);line-height:1.2}
.detail-tagline{font-size:15px;color:var(--accent-2);font-weight:600;margin-bottom:18px;letter-spacing:-.01em}
.detail-desc{font-size:15px;color:var(--label-2);margin-bottom:22px;line-height:1.55}
.detail-h3{font-size:17px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em;color:var(--label)}
.highlights{
  list-style:none;border-radius:var(--radius-card);padding:0;
  margin-bottom:22px;overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
}
.highlights li{
  font-size:14.5px;color:var(--label);padding:15px 19px;
  display:flex;gap:12px;align-items:flex-start;line-height:1.45;
}
.highlights li + li{border-top:0.5px solid var(--separator)}
.highlights li::before{
  content:"✓";color:var(--accent-2);font-weight:800;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;
  background:var(--accent-soft);display:grid;place-items:center;
  font-size:12px;margin-top:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.cta-block{display:grid;gap:10px;margin-bottom:24px}

.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#31d977 0%,#25d366 100%);
  color:#fff;font-weight:700;font-size:15.5px;
  letter-spacing:-.01em;padding:16px;border-radius:var(--radius-button);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;text-align:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 1px 2px rgba(0,0,0,0.08),
    0 4px 12px rgba(37,211,102,0.25);
  position:relative;border:none;font-family:inherit;width:100%;
}
.wa-btn:active{
  transform:scale(.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 1px 2px rgba(0,0,0,0.08),
    0 2px 6px rgba(37,211,102,0.2);
}
.wa-btn-outline{
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  color:var(--label);
  box-shadow:var(--shadow-liquid-sm);
  border:0.5px solid rgba(0,0,0,0.04);
}
.wa-btn-outline:active{background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}

.wa-btn.has-selection{
  background:linear-gradient(180deg,#1da851 0%,#148a3f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 0 0 4px rgba(37,211,102,0.16),
    0 4px 12px rgba(37,211,102,0.35);
  animation:btnPulse .45s var(--smooth) 1;
}
.wa-btn.promo-ready{
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 0 0 4px rgba(255,159,10,0.2),
    0 4px 12px rgba(255,159,10,0.35);
  animation:btnPulse .45s var(--smooth) 1;
}
@keyframes btnPulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

.harga-card{
  border-radius:var(--radius-card);overflow:hidden;margin-bottom:22px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
}
.harga-section{padding:17px 19px}
.harga-section + .harga-section{border-top:0.5px solid var(--separator)}
.harga-label{
  font-size:11px;font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
}
.harga-value{font-size:23px;font-weight:800;letter-spacing:-.025em;color:var(--label);line-height:1.1}
.harga-value small{font-size:13px;font-weight:600;color:var(--label-3);margin-left:2px}
.harga-note{font-size:12px;color:var(--label-2);margin-top:6px;line-height:1.45}
.harga-cta{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:15px;background:var(--accent-soft);color:var(--accent-2);
  font-weight:700;font-size:13.5px;border:none;width:100%;cursor:pointer;
  transition:background .15s;font-family:inherit;letter-spacing:-.01em;
  position:relative;
}
.harga-cta:active{background:rgba(255,159,10,0.2)}

.float-wa{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));

.sheet-backdrop{

}
.sheet-btn-cash:active{box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 2px 6px rgba(37,211,102,0.2)}

}
.sheet-btn-kredit:active{box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 2px 6px rgba(255,159,10,0.22)}
.sheet-btn-icon{

}
.sheet-btn-kredit .sheet-btn-icon{background:rgba(0,0,0,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.2)}
.sheet-btn-body{flex:1;min-width:0}
.sheet-btn-body strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.015em;margin-bottom:2px;
}
.sheet-btn-body span{
  display:block;font-size:12.5px;opacity:0.88;

}
.sheet-cancel{

}
.sheet-cancel:active{transform:scale(.97);background:var(--surface-2)}

footer{text-align:center;padding:44px 0 22px;font-size:12px;color:var(--label-3);letter-spacing:-.005em}
.not-found{padding:80px 24px;text-align:center}
.not-found h2{font-size:22px;margin-bottom:12px;color:var(--label);letter-spacing:-.025em}

@supports not ((backdrop-filter:blur(24px)) or (-webkit-backdrop-filter:blur(24px))){
  .section-head{background:var(--bg)}

function getAllDpOptions(model){ return Object.keys(model.tabel).map(Number).sort((a,b)=>a-b); }

function getDefaultDp(name){
  const model = getModelData(name);
  if (!model) return null;
  const opts = getSliderDpOptions(model);
  if (!opts.length) return null;
  const triggerDp = getPromoTriggerDp(name);
  if (triggerDp !== null && opts.includes(triggerDp)) return triggerDp;
  const target = (model.harga || 0) * (CONFIG.dpDefaultPct / 100);
  return opts.reduce((best, cur) => Math.abs(cur - target) < Math.abs(best - target) ? cur : best, opts[0]);
}

function getCicilanHeader(name){
  const model = getModelData(name);
  if (!model) return null;
  const opts = getSliderDpOptions(model);
  if (!opts.length) return null;

  const triggerDp = getPromoTriggerDp(name);
  if (triggerDp !== null && opts.includes(triggerDp)) {
    const tbl = model.tabel[String(triggerDp)];
    const t35 = tbl && tbl[35];
    if (t35) return { dp: triggerDp, tenor: 35, cicilan: t35 };
  }

  const target = (model.harga || 0) * (CONFIG.dpDefaultPct / 100);
  const dpClose = opts.reduce((best, cur) => Math.abs(cur - target) < Math.abs(best - target) ? cur : best, opts[0]);

  const tenors = Object.keys(tbl).map(Number).sort((a,b)=>b-a);

  const t = tbl[35] ? 35 : tenors[0];
  return { dp: dpClose, tenor: t, cicilan: tbl[String(t)] };

  if (heroBottom > 20) floatWa.classList.add('is-hidden');
  else floatWa.classList.remove('is-hidden');

function setupStickyHeads(screen){
  const heads = screen.querySelectorAll('.section-head');
  if (!heads.length) return;
  const onScroll = () => {
    if (!screen.classList.contains('is-active')) return;
    heads.forEach(head => {
      const rect = head.getBoundingClientRect();
      head.classList.toggle('is-stuck', rect.top <= 1 && rect.top >= -1);
    });
  };
  screen.addEventListener('scroll', onScroll, { passive: true });
  screen._stickyOnScroll = onScroll;
}

  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

function filterModelsByState(f){
  let names = getAllModelNames();
  if (f.cat !== 'all') {
    const cat = CATEGORIES.find(c => c.key === f.cat);
    if (cat) names = names.filter(n => cat.models.includes(n));
  }
  if (f.q) { const q = f.q.toLowerCase(); names = names.filter(n => n.toLowerCase().includes(q)); }
  return names;
}

function renderFilterBar(f, prefix){

        <button class="cat-chip${f.cat === 'all' ? ' is-active' : ''}" data-cat="${prefix}:all">Semua</button>
        ${CATEGORIES.map(c => `

}

function renderDpSlider(name, currentDp){
  const data = getModelData(name);
  if (!data) return '';
  const opts = getSliderDpOptions(data);
  if (!opts.length) return '';
  const idx = Math.max(0, opts.indexOf(currentDp));
  const minDp = opts[0];
  const maxDp = opts[opts.length - 1];
  const pct = opts.length > 1 ? (idx / (opts.length - 1)) * 100 : 0;

  const triggerDp = getPromoTriggerDp(name);
  const isAtTrigger = triggerDp !== null && opts[idx] === triggerDp;
  const hasPromo = isBeatSeries(name) && isPromoAvailable(name);
  const p = CONFIG.promo.beatSeries;

  return `
    <div class="dp-slider-wrap" data-dp-wrap="${esc(name)}">
      <div class="dp-display">
        <div>
          <span class="dp-display-label">DP Dipilih</span>
          <span class="dp-display-sub" data-dp-sub>Geser untuk ubah DP</span>
        </div>
        <span class="dp-display-value" data-dp-value>${formatRp(opts[idx])}</span>
      </div>
      <input type="range" class="dp-slider"
             data-model="${esc(name)}"
             min="0" max="${opts.length - 1}" value="${idx}" step="1"
             style="--pct: ${pct}%"
             aria-label="Geser untuk atur DP">
      <div class="dp-slider-labels">
        <span>${formatRp(minDp)}</span>
        <span>${formatRp(maxDp)}</span>
      </div>
      <div class="dp-note">Belum termasuk diskon & potongan tenor</div>
      ${hasPromo ? `
        <div class="promo-container${isAtTrigger ? ' is-visible' : ''}" data-promo-container="${esc(name)}">
          <div class="promo-divider">atau</div>
          <button class="promo-btn" data-promo-toggle="${esc(name)}" type="button">
            ⚡ Coba DP Promo ${formatRp(p.dp)} · Tenor ${p.tenor} bulan
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderRoute(route){
  if (!route || route === '/') return renderHome();
  if (route.startsWith('/model/')) return renderModelDetail(route.slice(7));
  if (route === '/stok') return renderStok();
  if (route === '/kredit') return renderKredit();
  return renderNotFound();
}

function routeToHash(route){
  if (route.startsWith('/model/')) return '/model/' + encodeURIComponent(route.slice(7));
  return route || '/';
}

function hashToRoute(hash){
  let path = hash.startsWith('#') ? hash.slice(1) : hash;
  if (!path) return '/';
  if (path.startsWith('/model/')) {
    const raw = path.slice(7);
    try { return '/model/' + decodeURIComponent(raw); }
    catch (e) { return '/model/' + raw; }
  }
  return path;
}
