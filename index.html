<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honda Bandung — Unit Ready, Proses Cepat</title>
<meta name="description" content="Sales resmi Honda Bandung. Cek stok, simulasi kredit, atau booking test ride langsung via WhatsApp.">
<meta name="theme-color" content="#e60012">
<style>
:root{
  --red:#e60012; --red-2:#b8000e;
  --dark:#0f0f10; --gray:#5b6168;
  --light:#f4f5f7; --white:#fff;
  --wa:#25d366; --wa-2:#128c7e;
  --radius:16px;
  --nav-duration:400ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;color:var(--dark);background:#e8eaee;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden}

/* ===== SCREEN SYSTEM (slide nav ala Android) ===== */
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--white);
  transform:translateX(100%);
  visibility:hidden;
  will-change:transform;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear var(--nav-duration);
  padding-bottom:100px;
}
.screen.is-active{
  transform:translateX(0);
  visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-28%);
  visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}

/* ===== CONTENT ANIMATION ===== */
.screen.is-active .anim-in{
  animation:fadeInUp .45s var(--nav-easing) both;
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.wrap{max-width:480px;margin:0 auto;padding:0 18px}
a{color:inherit;text-decoration:none}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(160deg,#e60012 0%,#b8000e 100%);
  color:#fff;padding:32px 0 28px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;
  width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;
  margin-bottom:14px;position:relative;z-index:1;
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1.8s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}
  70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}
.hero h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;position:relative;z-index:1}
.hero p{font-size:15px;opacity:.92;margin-bottom:20px;position:relative;z-index:1}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;background:#fff;color:var(--red);font-weight:700;font-size:16px;
  padding:16px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.18);
  transition:transform .15s ease;position:relative;z-index:1;cursor:pointer;
}
.hero-cta:active{transform:scale(.98)}

section{padding:28px 0 4px}
.section-title{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.section-sub{font-size:13px;color:var(--gray);margin-bottom:18px}

/* ===== ACTIONS ===== */
.actions{display:grid;gap:10px}
.action{
  display:flex;align-items:center;gap:14px;padding:16px;
  border-radius:14px;background:var(--light);
  border:1px solid rgba(0,0,0,.04);
  transition:transform .15s ease,background .15s;cursor:pointer;
}
.action:active{transform:scale(.985);background:#ebedf0}
.action-ico{
  width:44px;height:44px;border-radius:12px;background:#fff;
  display:grid;place-items:center;font-size:22px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}
.action-body{flex:1;min-width:0}
.action-body strong{display:block;font-size:15px;font-weight:700}
.action-body span{display:block;font-size:12.5px;color:var(--gray);margin-top:2px}
.action-arrow{color:var(--gray);font-size:18px}

/* ===== MODELS ===== */
.models{display:grid;gap:12px}
.model{
  border-radius:var(--radius);background:var(--light);overflow:hidden;
  border:1px solid rgba(0,0,0,.04);
  transition:transform .15s ease;cursor:pointer;display:block;
}
.model:active{transform:scale(.985)}
.model-img{
  height:140px;display:grid;place-items:center;
  background:linear-gradient(135deg,#e8eaee,#d3d6dc);
  font-size:56px;position:relative;
}
.model-img .tag{
  position:absolute;top:10px;left:10px;background:var(--red);color:#fff;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.02em;
}
.model-body{padding:14px 16px 16px}
.model-body h3{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.model-body p{font-size:12.5px;color:var(--gray);margin-bottom:12px}
.model-btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;
  font-weight:700;font-size:13px;padding:10px 14px;border-radius:10px;
  width:100%;justify-content:center;
}
.model:active .model-btn{background:var(--red-2)}

/* ===== TRUST ===== */
.trust{background:var(--light);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.trust-item{display:flex;gap:12px;align-items:flex-start}
.trust-ico{
  width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700;flex-shrink:0;
}
.trust-item strong{display:block;font-size:14px;font-weight:700}
.trust-item span{display:block;font-size:12.5px;color:var(--gray);margin-top:2px}

/* ===== DETAIL HEADER (sticky + back) ===== */
.detail-header{
  position:sticky;top:0;z-index:10;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;align-items:center;padding:10px 14px;gap:8px;
}
.back-btn{
  width:40px;height:40px;border-radius:12px;background:var(--light);
  border:none;display:grid;place-items:center;cursor:pointer;color:var(--dark);
  transition:background .15s,transform .1s;flex-shrink:0;
}
.back-btn:active{background:#e0e2e6;transform:scale(.95)}
.detail-title{
  flex:1;font-size:16px;font-weight:700;text-align:center;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== MODEL DETAIL ===== */
.model-hero{
  height:220px;background:linear-gradient(135deg,#e8eaee,#d3d6dc);
  display:grid;place-items:center;position:relative;font-size:100px;
}
.model-hero .tag{
  position:absolute;top:16px;left:16px;background:var(--red);color:#fff;
  font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;
}
.detail-h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.detail-tagline{font-size:14px;color:var(--red);font-weight:600;margin-bottom:14px}
.detail-desc{font-size:14.5px;color:var(--gray);margin-bottom:20px;line-height:1.6}
.detail-h3{font-size:16px;font-weight:800;margin-bottom:12px;letter-spacing:-.01em}
.highlights{
  list-style:none;background:var(--light);border-radius:var(--radius);
  padding:16px;margin-bottom:20px;
}
.highlights li{
  font-size:14px;color:var(--dark);padding:6px 0;
  display:flex;gap:8px;align-items:flex-start;
}
.highlights li::before{content:"✓";color:var(--red);font-weight:700;flex-shrink:0}
.cta-block{display:grid;gap:10px;margin-bottom:20px}
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--wa);color:#fff;font-weight:700;font-size:15px;
  padding:15px;border-radius:12px;
  transition:background .15s,transform .1s;cursor:pointer;
  text-align:center;
}
.wa-btn:active{background:var(--wa-2);transform:scale(.98)}
.wa-btn-outline{background:var(--light);color:var(--dark)}
.wa-btn-outline:active{background:#e0e2e6}

/* ===== FLOAT WA ===== */
.float-wa{
  position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;
  background:var(--wa);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(37,211,102,.45),0 2px 8px rgba(0,0,0,.15);
  z-index:100;transition:transform .15s ease;cursor:pointer;
  animation:floatIn .5s var(--nav-easing) both;animation-delay:.3s;
}
.float-wa:active{transform:scale(.92)}
.float-wa svg{width:30px;height:30px}
@keyframes floatIn{
  from{opacity:0;transform:translateY(20px) scale(.8)}
  to{opacity:1;transform:none}
}

footer{text-align:center;padding:28px 0 16px;font-size:12px;color:var(--gray)}
.not-found{padding:80px 24px;text-align:center}
.not-found h2{font-size:20px;margin-bottom:12px}
.not-found p{color:var(--gray);margin-bottom:20px}
</style>
</head>
<body>

<div id="app"></div>

<a class="float-wa" id="floatWa" href="#" aria-label="Chat WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.83.98h.01a7.94 7.94 0 0 0 5.56-13.56ZM12.05 18.5h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.65.67-2.43-.16-.25a6.58 6.58 0 0 1-1.01-3.51 6.6 6.6 0 0 1 6.6-6.6 6.56 6.56 0 0 1 4.66 1.93 6.6 6.6 0 0 1 1.93 4.68 6.6 6.6 0 0 1-6.6 6.59Zm3.62-4.94c-.2-.1-1.17-.58-1.35-.65-.18-.06-.32-.1-.45.1-.14.2-.53.65-.65.78-.12.13-.24.14-.44.05-.2-.1-.84-.31-1.6-.99-.6-.53-1-1.18-1.12-1.38-.12-.2-.01-.31.09-.41.09-.09.2-.24.3-.36.1-.12.13-.2.2-.34.06-.13.03-.25-.02-.35-.05-.1-.45-1.08-.61-1.48-.16-.39-.33-.34-.45-.34h-.38c-.13 0-.35.05-.53.25-.18.2-.7.68-.7 1.66 0 .98.72 1.93.82 2.06.1.13 1.4 2.14 3.4 3 .48.2.85.33 1.14.42.48.15.91.13 1.26.08.38-.06 1.17-.48 1.34-.94.17-.46.17-.85.12-.93-.05-.08-.18-.13-.38-.23Z"/></svg>
</a>

<script>
/* ============ KONFIGURASI ============ */
const CONFIG = {
  phone: "6285155070692",
  brand: "Honda Bandung",
  defaultMessage: "Halo, saya dari TikTok. Mau tanya-tanya soal motor Honda."
};

const MODELS = {
  beat: {
    name: "Honda Beat", emoji: "🛵", tag: "TERLARIS",
    tagline: "Paling irit untuk harian, cocok untuk pemula",
    description: "Skuter matic paling populer di Indonesia. Irit bahan bakar, ringan, dan cocok untuk mobilitas harian di kota maupun penggunaan sehari-hari.",
    highlights: ["Konsumsi BBM sangat irit","Ringan dan mudah dikendarai","Biaya perawatan terjangkau","Cocok untuk pemula"]
  },
  vario: {
    name: "Honda Vario", emoji: "🛵",
    tagline: "Nyaman untuk harian & jarak menengah",
    description: "Skuter matic premium dengan bagasi lega dan posisi berkendara nyaman. Cocok untuk mobilitas harian maupun perjalanan jarak menengah.",
    highlights: ["Bagasi luas","Posisi berkendara nyaman","Mesin bertenaga","Desain premium"]
  },
  pcx: {
    name: "Honda PCX", emoji: "🏍️", tag: "PREMIUM",
    tagline: "Premium untuk jarak jauh",
    description: "Skuter matic premium dengan fitur lengkap dan kenyamanan maksimal untuk perjalanan jarak jauh.",
    highlights: ["Fitur lengkap & modern","Nyaman untuk touring","Desain elegan","Performa bertenaga"]
  },
  adv: {
    name: "Honda ADV", emoji: "🏍️",
    tagline: "Gaya adventure, tangguh di segala medan",
    description: "Skuter adventure dengan gaya tangguh dan performa andal untuk segala medan.",
    highlights: ["Desain adventure","Tangguh di segala medan","Posisi berkendara tegak","Performa bertenaga"]
  }
};

const NAV_DURATION = 400;
const app = document.getElementById('app');
const stack = [];
let animating = false;

const waLink = msg => 'https://wa.me/' + CONFIG.phone + '?text=' + encodeURIComponent(msg || CONFIG.defaultMessage);
const openWa = msg => window.open(waLink(msg), '_blank', 'noopener');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ RENDERERS ============ */
function renderModelCards() {
  return Object.entries(MODELS).map(([key, m]) => `
    <a class="model" data-nav="/model/${key}">
      <div class="model-img">${m.tag ? `<span class="tag">${m.tag}</span>` : ''}${m.emoji}</div>
      <div class="model-body">
        <h3>${esc(m.name)}</h3>
        <p>${esc(m.tagline)}</p>
        <span class="model-btn">Lihat Detail →</span>
      </div>
    </a>
  `).join('');
}

function renderHome() {
  return `
    <header class="hero anim-in">
      <div class="wrap">
        <div class="badge"><span class="dot"></span> Online sekarang</div>
        <h1>Sales Resmi Honda Bandung — Unit Ready, Proses Cepat</h1>
        <p>Tanya stok, simulasi kredit, atau booking test ride langsung via WhatsApp.</p>
        <a class="hero-cta" data-msg="Halo, saya dari TikTok. Mau tanya-tanya soal motor Honda.">💬 Chat WhatsApp Sekarang</a>
      </div>
    </header>
    <main class="wrap">
      <section class="anim-in">
        <h2 class="section-title">Pilih kebutuhanmu</h2>
        <p class="section-sub">Satu tap, langsung terhubung ke WhatsApp saya.</p>
        <div class="actions">
          <a class="action" data-nav="/stok">
            <div class="action-ico">🏍️</div>
            <div class="action-body"><strong>Tanya Stok & Harga</strong><span>Unit ready, harga update</span></div>
            <div class="action-arrow">›</div>
          </a>
          <a class="action" data-nav="/kredit">
            <div class="action-ico">💰</div>
            <div class="action-body"><strong>Simulasi Kredit</strong><span>Hitung DP & cicilan</span></div>
            <div class="action-arrow">›</div>
          </a>
          <a class="action" data-nav="/testride">
            <div class="action-ico">📅</div>
            <div class="action-body"><strong>Booking Test Ride</strong><span>Coba dulu, baru beli</span></div>
            <div class="action-arrow">›</div>
          </a>
        </div>
      </section>
      <section class="anim-in">
        <h2 class="section-title">Model favorit</h2>
        <p class="section-sub">Klik model untuk lihat detail.</p>
        <div class="models">${renderModelCards()}</div>
      </section>
      <section class="anim-in">
        <h2 class="section-title">Kenapa beli dari saya?</h2>
        <p class="section-sub">Bukan calo. Sales resmi, proses transparan.</p>
        <div class="trust">
          <div class="trust-item"><div class="trust-ico">✓</div><div><strong>Unit ready & bisa dilihat</strong><span>Stok fisik tersedia, bisa cek langsung sebelum beli.</span></div></div>
          <div class="trust-item"><div class="trust-ico">✓</div><div><strong>Bantu proses kredit</strong><span>Dibantu sampai disetujui, tanpa biaya tersembunyi.</span></div></div>
          <div class="trust-item"><div class="trust-ico">✓</div><div><strong>Sales resmi Honda</strong><span>Bukan perantara. Legal, aman, dan terpercaya.</span></div></div>
        </div>
      </section>
    </main>
    <footer>© ${new Date().getFullYear()} ${esc(CONFIG.brand)}</footer>
  `;
}

function renderBackHeader(title) {
  return `
    <header class="detail-header anim-in">
      <button class="back-btn" data-back aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="detail-title">${esc(title)}</span>
      <div style="width:40px;flex-shrink:0"></div>
    </header>
  `;
}

function renderModelDetail(key) {
  const m = MODELS[key];
  if (!m) return renderNotFound();
  return `
    ${renderBackHeader(m.name)}
    <div class="model-hero anim-in">
      ${m.tag ? `<span class="tag">${m.tag}</span>` : ''}
      <div>${m.emoji}</div>
    </div>
    <div class="wrap" style="padding-top:20px">
      <h2 class="detail-h2 anim-in">${esc(m.name)}</h2>
      <p class="detail-tagline anim-in">${esc(m.tagline)}</p>
      <p class="detail-desc anim-in">${esc(m.description)}</p>
      <div class="anim-in">
        <h3 class="detail-h3">Keunggulan</h3>
        <ul class="highlights">${m.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
      </div>
      <div class="cta-block anim-in">
        <a class="wa-btn" data-msg="Halo, saya dari TikTok. Mau tanya stok & harga ${esc(m.name)}.">💬 Tanya Stok & Harga ${esc(m.name)}</a>
        <a class="wa-btn wa-btn-outline" data-msg="Halo, saya mau simulasi kredit ${esc(m.name)}. DP berapa & cicilan per bulan?">💰 Simulasi Kredit ${esc(m.name)}</a>
      </div>
    </div>
  `;
}

function renderStok() {
  return `
    ${renderBackHeader('Tanya Stok & Harga')}
    <div class="wrap" style="padding-top:20px">
      <p class="detail-desc anim-in">Pilih model yang ingin dicek stok & harganya. Saya balas cepat dengan info unit terbaru.</p>
      <div class="actions anim-in">
        ${Object.entries(MODELS).map(([key, m]) => `
          <a class="action" data-msg="Halo, saya dari TikTok. Mau tanya stok & harga ${esc(m.name)}.">
            <div class="action-ico">${m.emoji}</div>
            <div class="action-body"><strong>${esc(m.name)}</strong><span>Tanya stok & harga</span></div>
            <div class="action-arrow">›</div>
          </a>
        `).join('')}
      </div>
    </div>
  `;
}

function renderKredit() {
  return `
    ${renderBackHeader('Simulasi Kredit')}
    <div class="wrap" style="padding-top:20px">
      <p class="detail-desc anim-in">Konsultasikan simulasi kredit untuk motor Honda pilihan Anda. DP ringan, cicilan terjangkau, dan proses dibantu sampai disetujui.</p>
      <div class="actions anim-in">
        ${Object.entries(MODELS).map(([key, m]) => `
          <a class="action" data-msg="Halo, saya mau simulasi kredit ${esc(m.name)}. DP berapa & cicilan per bulan?">
            <div class="action-ico">💰</div>
            <div class="action-body"><strong>Kredit ${esc(m.name)}</strong><span>Simulasi DP & cicilan</span></div>
            <div class="action-arrow">›</div>
          </a>
        `).join('')}
      </div>
    </div>
  `;
}

function renderTestRide() {
  return `
    ${renderBackHeader('Booking Test Ride')}
    <div class="wrap" style="padding-top:20px">
      <p class="detail-desc anim-in">Booking test ride untuk motor Honda pilihan Anda. Coba dulu, rasakan langsung sebelum memutuskan.</p>
      <div class="actions anim-in">
        ${Object.entries(MODELS).map(([key, m]) => `
          <a class="action" data-msg="Halo, saya mau booking test ride ${esc(m.name)}. Kapan jadwal yang tersedia?">
            <div class="action-ico">📅</div>
            <div class="action-body"><strong>Test Ride ${esc(m.name)}</strong><span>Booking jadwal test ride</span></div>
            <div class="action-arrow">›</div>
          </a>
        `).join('')}
      </div>
    </div>
  `;
}

function renderNotFound() {
  return `
    ${renderBackHeader('Tidak Ditemukan')}
    <div class="not-found">
      <h2>Halaman tidak ditemukan</h2>
      <p>Halaman yang Anda cari tidak tersedia.</p>
      <a class="wa-btn" data-back>← Kembali</a>
    </div>
  `;
}

function renderRoute(route) {
  if (route === '/') return renderHome();
  if (route.indexOf('/model/') === 0) return renderModelDetail(route.slice(7));
  if (route === '/stok') return renderStok();
  if (route === '/kredit') return renderKredit();
  if (route === '/testride') return renderTestRide();
  return renderNotFound();
}

/* ============ NAVIGATION ============ */
function makeScreen(route) {
  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.route = route;
  el.innerHTML = renderRoute(route);
  return el;
}

function pushScreen(route, animate) {
  if (animate && animating) return;
  const current = stack[stack.length - 1];
  const el = makeScreen(route);
  app.appendChild(el);

  if (animate && current) {
    animating = true;
    void el.offsetWidth;
    current.classList.remove('is-active');
    current.classList.add('is-behind');
    el.classList.add('is-active');
    setTimeout(() => { animating = false; }, NAV_DURATION);
  } else if (animate) {
    animating = true;
    el.classList.add('is-active');
    setTimeout(() => { animating = false; }, NAV_DURATION);
  } else {
    el.classList.add('no-transition', 'is-active');
    requestAnimationFrame(() => el.classList.remove('no-transition'));
  }
  stack.push(el);
}

function popScreen(animate) {
  if (animate && animating) return;
  if (stack.length <= 1) return;
  const current = stack.pop();
  const prev = stack[stack.length - 1];

  if (animate) {
    animating = true;
    current.classList.remove('is-active');
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    setTimeout(() => { current.remove(); animating = false; }, NAV_DURATION);
  } else {
    current.remove();
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
  }
}

function navigate(route) {
  if (animating) return;
  const current = stack[stack.length - 1];
  if (current && current.dataset.route === route) return;
  history.pushState({ index: stack.length, route }, '', '#' + route);
  pushScreen(route, true);
}

/* ============ EVENT HANDLING ============ */
app.addEventListener('click', e => {
  if (animating) return;
  const navEl = e.target.closest('[data-nav]');
  if (navEl) { e.preventDefault(); navigate(navEl.dataset.nav); return; }
  const backEl = e.target.closest('[data-back]');
  if (backEl) { e.preventDefault(); if (stack.length > 1) history.back(); return; }
  const msgEl = e.target.closest('[data-msg]');
  if (msgEl) { e.preventDefault(); openWa(msgEl.dataset.msg); return; }
});

document.getElementById('floatWa').addEventListener('click', e => {
  e.preventDefault();
  openWa(CONFIG.defaultMessage);
});

window.addEventListener('popstate', e => {
  const state = e.state || { index: 0, route: '/' };
  const targetIndex = state.index;
  const currentIndex = stack.length - 1;
  if (targetIndex === currentIndex) return;
  if (targetIndex < currentIndex) popScreen(true);
  else if (state.route) pushScreen(state.route, true);
});

/* ============ INIT ============ */
(function init() {
  const initialRoute = location.hash.slice(1) || '/';
  history.replaceState({ index: 0, route: '/' }, '', '#/');

  const homeEl = makeScreen('/');
  homeEl.classList.add('no-transition', 'is-active');
  app.appendChild(homeEl);
  stack.push(homeEl);

  if (initialRoute !== '/' && initialRoute !== '') {
    history.pushState({ index: 1, route: initialRoute }, '', '#' + initialRoute);
    const detailEl = makeScreen(initialRoute);
    detailEl.classList.add('no-transition', 'is-active');
    homeEl.classList.remove('is-active');
    homeEl.classList.add('is-behind');
    app.appendChild(detailEl);
    stack.push(detailEl);
  }

  requestAnimationFrame(() => {
    document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
  });
})();
</script>
</body>
