<style>
:root{

  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#86868b;
  --separator:rgba(60,60,67,0.08);
  --fill:rgba(120,120,128,0.08); --fill-2:rgba(120,120,128,0.12);
  --accent:#ff9500; --accent-2:#f58a00; --accent-text:#1c1c1e;
  --accent-soft:rgba(255,149,0,0.12);
  --wa:#25d366; --wa-2:#1da851; --wa-glass:rgba(37,211,102,0.92);
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);

  --radius-card:20px; --radius-button:14px; --radius-pill:999px;

  --smooth:cubic-bezier(.4,0,.2,1);
  --nav-duration:400ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
  --blur-glass:blur(12px) saturate(150%);
  --blur-glass-sm:blur(10px) saturate(150%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{

.screen{

  -webkit-overflow-scrolling:touch;background:var(--bg);
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear var(--nav-duration);
  padding-bottom:120px;
}
.screen.is-active{
  transform:translateX(0);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-28%);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen.is-active .anim-in{animation:fadeInUp .5s var(--smooth) both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

const formatRp = n => (n === null || n === undefined || isNaN(n)) ? '—' : 'Rp ' + Number(n).toLocaleString('id-ID');

function getAllModelNames(){ return Object.keys(DATA_MOTOR); }
function getModelData(name){ return DATA_MOTOR[name] || null; }
function getCategoryOf(name){ return CATEGORIES.find(c => c.models.includes(name)); }
function getEmojiFor(name){ const c = getCategoryOf(name); return c ? c.icon : '🏍️'; }
function isBeatSeries(name){ return /beat/i.test(name); }

function getPromoConfig(name){
  const map = CONFIG.promo.beatSeries.perModel || {};
  return map[name] || null;
}
function getPromoTriggerDp(name){
  const c = getPromoConfig(name);
  return c ? c.triggerDp : null;
}
function getPromoCicilan(name){
  const c = getPromoConfig(name);
  return c ? c.cicilan : null;
}
function isPromoAvailable(name){
  const p = CONFIG.promo.beatSeries;
  if (!p || p.dp <= 0 || p.tenor <= 0) return false;
  const c = getPromoConfig(name);
  if (!c) return false;
  const model = getModelData(name);
  if (!model) return false;
  const opts = getAllDpOptions(model);
  return opts.includes(c.triggerDp) && c.cicilan > 0;
}

function getModelMeta(name){
  const ov = MODEL_OVERRIDES[name] || {};
  const cat = getCategoryOf(name);
  return {
    key:name, name:name, emoji:getEmojiFor(name),
    category: cat ? cat.key : '',
    tag: ov.tag || null,
    tagline: ov.tagline || (cat ? 'Honda ' + name : 'Cek harga OTR & simulasi kredit'),
    description: ov.description || `Motor Honda ${name}. Harga OTR terbaru dan simulasi kredit FIFGROUP tersedia.`,
    highlights: ov.highlights || ['Harga OTR terbaru','Simulasi kredit tersedia','Konsultasi via WhatsApp','Sales resmi Honda']
  };
}

function getAllDpOptions(model){ return Object.keys(model.tabel).map(Number).sort((a,b)=>a-b); }
function getSliderDpOptions(model){ return getAllDpOptions(model); }

function getDefaultDp(name){
  const model = getModelData(name);
  if (!model) return null;
  const opts = getSliderDpOptions(model);
  if (!opts.length) return null;
  const triggerDp = getPromoTriggerDp(name);
  if (triggerDp !== null && opts.includes(triggerDp)) return triggerDp;
  const target = (model.harga || 0) * (CONFIG.dpDefaultPct / 100);
  return opts.reduce((best, cur) => Math.abs(cur - target) < Math.abs(best - target) ? cur : best, opts[0]);
}

function getCicilanHeader(name){
  const model = getModelData(name);
  if (!model) return null;
  const opts = getSliderDpOptions(model);
  if (!opts.length) return null;
  
  const triggerDp = getPromoTriggerDp(name);
  if (triggerDp !== null && opts.includes(triggerDp)) {
    const tbl = model.tabel[String(triggerDp)];
    const t35 = tbl && tbl[35];
    if (t35) return { dp: triggerDp, tenor: 35, cicilan: t35 };
  }
  
  const target = (model.harga || 0) * (CONFIG.dpDefaultPct / 100);
  const dpClose = opts.reduce((best, cur) => Math.abs(cur - target) < Math.abs(best - target) ? cur : best, opts[0]);
  const tbl = model.tabel[String(dpClose)];
  if (!tbl) return null;
  const tenors = Object.keys(tbl).map(Number).sort((a,b)=>b-a);
  if (!tenors.length) return null;
  const t = 35 in tbl ? 35 : tenors[0];
  return { dp: dpClose, tenor: t, cicilan: tbl[String(t)] };
}

function getTenors(model, dp){
  const t = model.tabel[String(dp)];
  if (!t) return [];
  return Object.keys(t).map(Number).sort((a,b)=>a-b);
}

function waLink(msg){
  return 'https://wa.me/' + CONFIG.phone + '?text=' + encodeURIComponent(msg || CONFIG.defaultMessage);
}

/**
 * Buka WhatsApp via anchor click (user gesture, no popup blocker).
 * Tidak ada setTimeout sebelum navigasi → tidak terdeteksi sebagai
 * scripted redirect. Loading state cuma visual.
 */
function openWa(msg, btnEl){
  if (btnEl){
    btnEl.classList.add('is-loading');
    setTimeout(() => btnEl.classList.remove('is-loading'), 1500);
  }
  const url = waLink(msg);
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

  const heroBottom = hero.getBoundingClientRect().bottom;

function setupStickyHeads(screen){
  const heads = screen.querySelectorAll('.section-head');
  if (!heads.length) return;
  const onScroll = () => {
    if (!screen.classList.contains('is-active')) return;
    heads.forEach(head => {
      const rect = head.getBoundingClientRect();
      head.classList.toggle('is-stuck', rect.top <= 1 && rect.top >= -1);
    });
  };
  screen.addEventListener('scroll', onScroll, { passive: true });
  screen._stickyOnScroll = onScroll;
}

function updateKonsultasiBtn(card){
  const btn = card.querySelector('[data-konsultasi]');
  if (!btn) return;
  const name = btn.dataset.konsultasi;
  const isPromo = card.classList.contains('promo-active');
  const selDp = card.dataset.selDp;
  const selTenor = card.dataset.selTenor;
  const selCicilan = card.dataset.selCicilan;
  
  btn.classList.remove('has-selection', 'promo-ready');
  
  if (isPromo) {
    const p = CONFIG.promo.beatSeries;
    const cicilan = getPromoCicilan(name);
    btn.innerHTML = `⚡ Ambil Promo · ${formatRp(cicilan)}/bln · ${p.tenor} bln`;
    btn.classList.add('promo-ready');
    return;
  }
  
  if (selTenor && selCicilan && selDp) {
    btn.innerHTML = `✅ Ajukan Pilihan · ${formatRp(+selCicilan)}/bln · ${selTenor} bln`;
    btn.classList.add('has-selection');

  }

  card.dataset.selDp = '';
  card.dataset.selTenor = '';
  card.dataset.selCicilan = '';

        ${CATEGORIES.map(c => `
          <button class="cat-chip${f.cat === c.key ? ' is-active' : ''}" data-cat="${prefix}:${c.key}">${esc(c.label)}</button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderStok(){

    ${renderBackHeader('Stok & Harga')}

/* ============================================================
   KREDIT
   ============================================================ */
function renderTenorRows(name, dp){
  const data = getModelData(name);
  if (!data) return '';
  const tenors = getTenors(data, dp);
  const tbl = data.tabel[String(dp)] || {};
  return tenors.map(t => {
    const cicilan = tbl[t];
    return `
      <button class="tenor-row" type="button"
              data-dp="${dp}" data-tenor="${t}" data-cicilan="${cicilan}"
              aria-pressed="false">
        <div class="tenor-dur">${t} bulan</div>
        <div class="tenor-cicilan">${formatRp(cicilan)}<small>/bln</small></div>
        <div class="tenor-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </button>
    `;
  }).join('');
}

function renderDpSlider(name, currentDp){
  const data = getModelData(name);
  if (!data) return '';
  const opts = getSliderDpOptions(data);
  if (!opts.length) return '';
  const idx = Math.max(0, opts.indexOf(currentDp));
  const minDp = opts[0];
  const maxDp = opts[opts.length - 1];
  const pct = opts.length > 1 ? (idx / (opts.length - 1)) * 100 : 0;
  
  const triggerDp = getPromoTriggerDp(name);
  const isAtTrigger = triggerDp !== null && opts[idx] === triggerDp;
  const hasPromo = isBeatSeries(name) && isPromoAvailable(name);
  const p = CONFIG.promo.beatSeries;
  
  return `
    <div class="dp-slider-wrap" data-dp-wrap="${esc(name)}">
      <div class="dp-display">
        <div>
          <span class="dp-display-label">DP Dipilih</span>
          <span class="dp-display-sub" data-dp-sub>Geser untuk ubah DP</span>
        </div>
        <span class="dp-display-value" data-dp-value>${formatRp(opts[idx])}</span>
      </div>
      <input type="range" class="dp-slider"
             data-model="${esc(name)}"
             min="0" max="${opts.length - 1}" value="${idx}" step="1"
             style="--pct: ${pct}%"
             aria-label="Geser untuk atur DP">
      <div class="dp-slider-labels">
        <span>${formatRp(minDp)}</span>
        <span>${formatRp(maxDp)}</span>
      </div>
      <div class="dp-note">Belum termasuk diskon & potongan tenor</div>
      ${hasPromo ? `
        <div class="promo-container${isAtTrigger ? ' is-visible' : ''}" data-promo-container="${esc(name)}">
          <div class="promo-divider">atau</div>
          <button class="promo-btn" data-promo-toggle="${esc(name)}" type="button">
            ⚡ Coba DP Promo ${formatRp(p.dp)} · Tenor ${p.tenor} bulan
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderPromoView(name){
  if (!isBeatSeries(name)) return '';
  if (!isPromoAvailable(name)) return '';
  const p = CONFIG.promo.beatSeries;
  const cicilan = getPromoCicilan(name);
  return `
    <div class="promo-view">
      <div class="promo-banner">
        <div class="promo-banner-label">⚡ Promo Spesial Beat Series</div>
        <div class="promo-banner-value">${formatRp(cicilan)}<small>/bln</small></div>
        <div class="promo-banner-meta">
          DP ${formatRp(p.dp)} · Tenor ${p.tenor} bulan
        </div>
        <div class="promo-banner-note">
          Cicilan promo belum termasuk diskon & potongan tenor. Ketuk tombol di bawah untuk konfirmasi via WhatsApp.
        </div>
        <button class="promo-banner-back" data-promo-toggle="${esc(name)}" type="button">
          ← Kembali ke DP Normal
        </button>

}

function renderKreditCardsList(){
  const names = filterModelsByState(kreditFilter);
  if (!names.length) return `<div class="empty-state">Tidak ada model yang cocok. Coba kata kata lain.</div>`;
  return names.map(name => {
    const data = getModelData(name);

    const meta = getModelMeta(name);

    return `
      <div class="kredit-card" data-kredit-card="${esc(name)}"
           data-sel-dp="" data-sel-tenor="" data-sel-cicilan="">

          <div class="kredit-emoji">${meta.emoji}</div>
          <div class="kredit-info">
            <strong>${esc(name)}</strong>
            ${cicilanHeader
              ? `<span class="kredit-mulai">Mulai ${formatRp(cicilanHeader.cicilan)}/bln</span>`

                ${renderDpSlider(name, defaultDp)}
                ${renderPromoView(name)}
                <div class="tenor-list" data-tenor-list="${esc(name)}">
                  ${renderTenorRows(name, defaultDp)}
                </div>
                <button class="wa-btn" type="button" data-konsultasi="${esc(name)}">
                  💬 Konsultasi Kredit
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

function renderKredit(){
  return `
    ${renderBackHeader('Simulasi Kredit')}
    <div class="wrap" style="padding-top:8px">
      <p class="detail-desc anim-in" style="margin-bottom:4px">Pilih model & atur DP. Tap tenor untuk pilih cicilan, lalu kirim via WhatsApp. Angka dari pricelist FIFGROUP.</p>
      ${renderFilterBar(kreditFilter, 'kredit')}
      <div id="kredit-list-container" class="anim-in">${renderKreditCardsList()}</div>
    </div>
  `;
}

function renderNotFound(){
  return `
    ${renderBackHeader('Tidak Ditemukan')}
    <div class="not-found">
      <h2>Halaman tidak ditemukan</h2>
      <p>Halaman yang Anda cari tidak tersedia.</p>
      <a class="wa-btn" data-back>← Kembali</a>
    </div>
  `;
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderRoute(route){
  if (route === '/') return renderHome();
  if (route.startsWith('/model/')) return renderModelDetail(decodeURIComponent(route.slice(7)));
  if (route === '/stok') return renderStok();
  if (route === '/kredit') return renderKredit();
  return renderNotFound();
}
function routeToHash(route){
  if (route.startsWith('/model/')) return '/model/' + encodeURIComponent(route.slice(7));
  return route;
}
function hashToRoute(hash){
  const path = hash.startsWith('#') ? hash.slice(1) : hash;
  if (path.startsWith('/model/')) return '/model/' + decodeURIComponent(path.slice(7));
  return path || '/';
}

/* ============================================================
   NAVIGATION ENGINE
   ============================================================ */
function makeScreen(route){
  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.route = route;
  el.innerHTML = renderRoute(route);
  const onScroll = () => { if (!el.classList.contains('is-active')) return; updateFloatWa(el); };
  el.addEventListener('scroll', onScroll, { passive: true });
  el._onScroll = onScroll;
  setupStickyHeads(el);
  return el;
}

function pushScreen(route, animate){
  if (animate && animating) return;
  const current = stack[stack.length - 1];
  const el = makeScreen(route);
  app.appendChild(el);
  const afterActivate = () => {
    animating = false;
    updateFloatWa(el);
    if (pendingKreditModel && route === '/kredit') {
      const target = pendingKreditModel;
      pendingKreditModel = null;
      setTimeout(() => expandKreditModel(el, target), 120);
    }
  };
  if (animate && current) {
    animating = true;
    void el.offsetWidth;
    current.classList.remove('is-active');
    current.classList.add('is-behind');
    el.classList.add('is-active');
    setTimeout(afterActivate, NAV_DURATION);
  } else if (animate) {
    animating = true;
    el.classList.add('is-active');
    setTimeout(afterActivate, NAV_DURATION);
  } else {
    el.classList.add('no-transition', 'is-active');
    requestAnimationFrame(() => {
      el.classList.remove('no-transition');
      afterActivate();
    });
  }
  stack.push(el);
}

function popScreen(animate){
  if (animate && animating) return;
  if (stack.length <= 1) return;
  const current = stack.pop();
  const prev = stack[stack.length - 1];
  if (animate) {
    animating = true;
    current.classList.remove('is-active');
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    setTimeout(() => {
      if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
      current.remove();
      animating = false;
      updateFloatWa(prev);
    }, NAV_DURATION);
  } else {
    if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
    current.remove();
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    updateFloatWa(prev);
  }
}

function navigate(route){
  if (animating) return;
  const current = stack[stack.length - 1];
  if (current && current.dataset.route === route) return;
  history.pushState({ index: stack.length, route }, '', '#' + routeToHash(route));
  pushScreen(route, true);
}

function refreshActiveList(prefix){
  const screen = stack[stack.length - 1];
  if (!screen) return;
  if (prefix === 'stok') {
    const c = screen.querySelector('#stok-list-container');
    if (c) c.innerHTML = renderStokList();
  } else if (prefix === 'kredit') {
    const c = screen.querySelector('#kredit-list-container');
    if (c) c.innerHTML = renderKreditCardsList();
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
app.addEventListener('click', e => {
  if (animating) return;

  const stokEl = e.target.closest('.stok-item');
  if (stokEl) {
    e.preventDefault();
    const name = stokEl.dataset.model;
    if (name) openActionSheet(name);
    return;
  }

  const toggleEl = e.target.closest('[data-toggle-kredit]');
  if (toggleEl) {
    e.preventDefault();
    const card = toggleEl.closest('.kredit-card');
    if (!card) return;
    const wasOpen = card.classList.contains('open');
    card.parentElement.querySelectorAll('.kredit-card.open').forEach(c => { if (c !== card) c.classList.remove('open'); });
    card.classList.toggle('open', !wasOpen);
    return;
  }

  const tenorEl = e.target.closest('.tenor-row');
  if (tenorEl) {
    e.preventDefault();
    const card = tenorEl.closest('.kredit-card');
    if (!card || card.classList.contains('promo-active')) return;
    const dp = tenorEl.dataset.dp;
    const tenor = tenorEl.dataset.tenor;
    const cicilan = tenorEl.dataset.cicilan;
    if (!dp || !tenor || !cicilan) return;
    
    card.querySelectorAll('.tenor-row').forEach(r => {
      r.classList.remove('is-selected');
      r.setAttribute('aria-pressed', 'false');
    });
    tenorEl.classList.add('is-selected');
    tenorEl.setAttribute('aria-pressed', 'true');
    
    card.dataset.selDp = dp;
    card.dataset.selTenor = tenor;
    card.dataset.selCicilan = cicilan;
    
    updateKonsultasiBtn(card);
    return;
  }

  const konsulEl = e.target.closest('[data-konsultasi]');
  if (konsulEl) {
    e.preventDefault();
    const card = konsulEl.closest('.kredit-card');
    if (!card) return;
    openWa(buildKonsultasiMsg(card), konsulEl);
    return;
  }

  const promoBtn = e.target.closest('[data-promo-toggle]');
  if (promoBtn) {
    e.preventDefault();
    const name = promoBtn.dataset.promoToggle;
    const card = promoBtn.closest('.kredit-card');
    if (!card) return;
    const data = getModelData(name);
    if (!data) return;
    const wasActive = card.classList.contains('promo-active');
    const p = CONFIG.promo.beatSeries;

    if (!wasActive) {
      resetSelection(card);
      card.classList.add('promo-active');
      const display = card.querySelector('[data-dp-value]');
      if (display) display.innerHTML = `${formatRp(p.dp)} <small style="font-size:10px;color:#ff9500;font-weight:800;margin-left:4px">PROMO</small>`;
      const sub = card.querySelector('[data-dp-sub]');
      if (sub) sub.textContent = 'Mode Promo Aktif';
      updateKonsultasiBtn(card);
    } else {
      card.classList.remove('promo-active');
      const triggerDp = getPromoTriggerDp(name);
      const opts = getSliderDpOptions(data);
      const targetDp = (triggerDp !== null && opts.includes(triggerDp)) ? triggerDp : getDefaultDp(name);
      const targetIdx = opts.indexOf(targetDp);
      const slider = card.querySelector('.dp-slider');
      if (slider && targetIdx >= 0) {
        slider.value = targetIdx;
        const pct = opts.length > 1 ? (targetIdx / (opts.length - 1)) * 100 : 0;
        slider.style.setProperty('--pct', pct + '%');
      }
      const display = card.querySelector('[data-dp-value]');
      if (display) display.textContent = formatRp(targetDp);
      const sub = card.querySelector('[data-dp-sub]');
      if (sub) sub.textContent = 'Geser untuk ubah DP';
      const tenorList = card.querySelector('.tenor-list');
      if (tenorList) tenorList.innerHTML = renderTenorRows(name, targetDp);
      const promoContainer = card.querySelector('[data-promo-container]');
      if (promoContainer) promoContainer.classList.add('is-visible');
      resetSelection(card);
    }
    return;
  }

  const catEl = e.target.closest('[data-cat]');
  if (catEl) {
    e.preventDefault();
    const [prefix, cat] = catEl.dataset.cat.split(':');
    const target = prefix === 'stok' ? stokFilter : kreditFilter;
    target.cat = cat;
    catEl.parentElement.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('is-active'));
    catEl.classList.add('is-active');
    refreshActiveList(prefix);
    return;
  }

  const navEl = e.target.closest('[data-nav]');
  if (navEl) {
    e.preventDefault();
    const expandTarget = navEl.dataset.expandKredit;
    if (expandTarget) pendingKreditModel = expandTarget;
    navigate(navEl.dataset.nav);
    return;
  }

  const backEl = e.target.closest('[data-back]');
  if (backEl) { e.preventDefault(); if (stack.length > 1) history.back(); return; }
});

app.addEventListener('input', e => {
  if (e.target.matches('.dp-slider')) {
    const name = e.target.dataset.model;
    const data = getModelData(name);
    if (!data) return;
    const card = e.target.closest('.kredit-card');
    if (!card || card.classList.contains('promo-active')) return;
    const opts = getSliderDpOptions(data);
    const idx = +e.target.value;
    const dp = opts[idx];
    if (dp === undefined) return;
    const pct = opts.length > 1 ? (idx / (opts.length - 1)) * 100 : 0;
    e.target.style.setProperty('--pct', pct + '%');
    const display = card.querySelector('[data-dp-value]');
    if (display) display.textContent = formatRp(dp);
    const tenorList = card.querySelector('.tenor-list');
    if (tenorList) tenorList.innerHTML = renderTenorRows(name, dp);
    
    resetSelection(card);

    const triggerDp = getPromoTriggerDp(name);
    const promoContainer = card.querySelector('[data-promo-container]');
    if (promoContainer && triggerDp !== null) {
      if (dp === triggerDp) promoContainer.classList.add('is-visible');
      else promoContainer.classList.remove('is-visible');
    }
    return;
  }
  if (e.target.matches('.search-input')) {
    const prefix = e.target.dataset.search;
    const target = prefix === 'stok' ? stokFilter : kreditFilter;
    target.q = e.target.value;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => refreshActiveList(prefix), 150);
  }
});

document.getElementById('sheetBackdrop').addEventListener('click', closeActionSheet);
document.getElementById('sheetCancel').addEventListener('click', closeActionSheet);

document.getElementById('actionSheet').addEventListener('click', e => {
  const btn = e.target.closest('[data-sheet-action]');
  if (!btn) return;
  const action = btn.dataset.sheetAction;
  const name = pendingSheetModel;
  if (!name) return;

  if (action === 'cash') {
    closeActionSheet();
  } else if (action === 'kredit') {
    closeActionSheet();
    pendingKreditModel = name;
    navigate('/kredit');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pendingSheetModel) closeActionSheet();
});

window.addEventListener('popstate', e => {
  const state = e.state || { index: 0, route: '/' };
  const targetIndex = state.index;
  const currentIndex = stack.length - 1;
  if (targetIndex === currentIndex) return;
  if (targetIndex < currentIndex) popScreen(true);
  else if (state.route) pushScreen(state.route, true);
});

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const initialRoute = hashToRoute(location.hash) || '/';
  history.replaceState({ index: 0, route: '/' }, '', '#/');
  const homeEl = makeScreen('/');
  homeEl.classList.add('no-transition', 'is-active');
  app.appendChild(homeEl);
  stack.push(homeEl);
  if (initialRoute !== '/' && initialRoute !== '') {
    history.pushState({ index: 1, route: initialRoute }, '', '#' + routeToHash(initialRoute));
    const detailEl = makeScreen(initialRoute);
    detailEl.classList.add('no-transition', 'is-active');
    homeEl.classList.remove('is-active');
    homeEl.classList.add('is-behind');
    app.appendChild(detailEl);
    stack.push(detailEl);
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(detailEl);
    });
  } else {
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(homeEl);
    });
  }
})();
</script>
