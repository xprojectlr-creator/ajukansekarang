<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dion Prayoga — Sales Honda Bandung</title>
<meta name="description" content="Katalog Honda Daya Motor Cibiru, Bandung. Harga OTR & simulasi kredit FIFGROUP.">
<meta name="theme-color" content="#1c1c1e">
<style>
:root{
  --bg:#f5f5f7; --bg-glass:rgba(245,245,247,0.75);
  --surface:#fff; --surface-2:#fafafa;
  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#86868b;
  --separator:rgba(60,60,67,0.08);
  --fill:rgba(120,120,128,0.08); --fill-2:rgba(120,120,128,0.12);
  --accent:#ff9500; --accent-2:#f58a00; --accent-text:#1c1c1e;
  --accent-soft:rgba(255,149,0,0.12);
  --wa:#25d366; --wa-2:#1da851; --wa-glass:rgba(37,211,102,0.9);
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-float:0 8px 24px rgba(37,211,102,.35),0 2px 8px rgba(0,0,0,.1);
  --radius-card:20px; --radius-button:14px; --radius-pill:999px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --nav-duration:400ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
  --blur-glass:blur(24px) saturate(180%);
  --blur-glass-sm:blur(20px) saturate(180%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;color:var(--label);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden}
button,a{touch-action:manipulation}

/* SCREEN SYSTEM */
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;background:var(--bg);
  transform:translateX(100%);visibility:hidden;will-change:transform;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear var(--nav-duration);
  padding-bottom:120px;
}
.screen.is-active{
  transform:translateX(0);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-28%);visibility:visible;
  transition:transform var(--nav-duration) var(--nav-easing),
             visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen.is-active .anim-in{animation:fadeInUp .5s var(--smooth) both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.wrap{max-width:520px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}

/* SPINNER */
.is-loading{pointer-events:none;position:relative;color:transparent!important}
.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
.wa-btn.is-loading::after,.wa-btn.is-loading{color:transparent}
.wa-btn.is-loading::after{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.hero-cta.is-loading{color:transparent!important}
.hero-cta.is-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--label)}
@keyframes spin{to{transform:rotate(360deg)}}

/* HERO */
.hero{
  background:
    radial-gradient(ellipse at 85% 0%,rgba(255,149,0,.22) 0%,transparent 55%),
    radial-gradient(ellipse at 0% 100%,rgba(255,100,0,.12) 0%,transparent 50%),
    linear-gradient(180deg,#1c1c1e 0%,#2c2c2e 100%);
  color:#fff;padding:calc(20px + env(safe-area-inset-top)) 0 28px;
  position:relative;overflow:hidden;
  border-bottom-left-radius:28px;border-bottom-right-radius:28px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.hero-profile{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.profile-avatar{
  width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#ffb84d 0%,#ff8500 100%);
  color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800;
  flex-shrink:0;position:relative;
  box-shadow:0 2px 8px rgba(255,149,0,.3),inset 0 0 0 1px rgba(255,255,255,.15);
}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0}
.profile-info strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-info span{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  padding:5px 10px;border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;flex-shrink:0;
  backdrop-filter:var(--blur-glass-sm);-webkit-backdrop-filter:var(--blur-glass-sm);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.hero p{font-size:14.5px;color:rgba(255,255,255,.7);margin-bottom:22px;line-height:1.5}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;background:var(--accent);color:var(--accent-text);
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  padding:17px;border-radius:var(--radius-button);
  box-shadow:0 4px 12px rgba(255,149,0,.3),0 1px 2px rgba(0,0,0,.15);
  transition:transform .2s var(--spring),background .15s;
  cursor:pointer;position:relative;
}
.hero-cta:active{transform:scale(.97);background:var(--accent-2)}

section{padding:8px 0 0}
.section-head{
  position:sticky;top:0;z-index:5;
  padding:20px 20px 14px;margin:0 -20px 10px;
  background:var(--bg-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  transition:box-shadow .2s ease;
}
.section-head.is-stuck{box-shadow:0 1px 0 rgba(60,60,67,.08)}
.section-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--label)}
.section-sub{font-size:13.5px;color:var(--label-2);margin:0}

/* SOCIAL */
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.social{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);cursor:pointer;
}
.social:active{transform:scale(.94)}
.social-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.social-icon svg{width:20px;height:20px}
.social-tiktok .social-icon{background:#000}
.social-ig .social-icon{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social-yt .social-icon{background:#ff0000}
.social span{font-size:11.5px;font-weight:600;color:var(--label);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ACTIONS */
.actions{display:grid;gap:10px}
.action{
  display:flex;align-items:center;gap:14px;padding:16px;
  border-radius:var(--radius-card);background:var(--surface);
  box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);cursor:pointer;
}
.action:active{transform:scale(.98)}
.action-ico{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.action-body{flex:1;min-width:0}
.action-body strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--label)}
.action-body span{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.action-arrow{color:var(--label-3);font-size:20px;font-weight:300}

/* MODEL CARDS */
.models{display:grid;gap:14px}
.model{
  border-radius:var(--radius-card);background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow-card);
  transition:transform .2s var(--spring);cursor:pointer;display:block;
}
.model:active{transform:scale(.98)}
.model-img{height:155px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#fafafa,#eaeaec);font-size:60px}
.model-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-img .tag{
  position:absolute;top:12px;left:12px;
  background:rgba(255,149,0,.82);
  backdrop-filter:var(--blur-glass-sm);-webkit-backdrop-filter:var(--blur-glass-sm);
  color:#fff;font-size:11px;font-weight:800;padding:6px 12px;
  border-radius:var(--radius-pill);letter-spacing:.04em;z-index:2;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 2px 6px rgba(255,149,0,.25);
}
.model-img .tag.tag-dark{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.15);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.model-body{padding:16px 18px 18px}
.model-body h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--label)}
.model-body p{font-size:13px;color:var(--label-2);margin-bottom:10px;line-height:1.5}
.model-body .model-price{font-size:14px;font-weight:700;color:var(--accent-2);margin-bottom:12px;letter-spacing:-.01em}
.model-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);color:var(--accent-text);
  font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  padding:12px 16px;border-radius:11px;
  width:100%;justify-content:center;transition:background .15s;
}
.model:active .model-btn{background:var(--accent-2)}

/* TRUST */
.trust{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden}
.trust-item{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.trust-item + .trust-item{border-top:1px solid var(--separator)}
.trust-ico{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0}
.trust-item strong{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--label)}
.trust-item span{display:block;font-size:13px;color:var(--label-2);margin-top:3px;line-height:1.45}

/* TERMS */
.terms{background:var(--surface);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-card)}
.terms h3{font-size:13px;font-weight:700;color:var(--label);letter-spacing:-.01em;margin-bottom:8px}
.terms p{font-size:12.5px;color:var(--label-2);line-height:1.55}

/* DETAIL HEADER */
.detail-header{
  position:sticky;top:0;z-index:10;background:var(--bg-glass);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  border-bottom:1px solid var(--separator);
  display:flex;align-items:center;padding:10px 14px;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.back-btn{
  width:42px;height:42px;border-radius:50%;background:var(--fill);
  border:none;display:grid;place-items:center;cursor:pointer;
  color:var(--label);transition:transform .2s var(--spring),background .15s;
  flex-shrink:0;
  backdrop-filter:var(--blur-glass-sm);-webkit-backdrop-filter:var(--blur-glass-sm);
}
.back-btn:active{background:var(--fill-2);transform:scale(.93)}
.detail-title{flex:1;font-size:16px;font-weight:700;text-align:center;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label)}

/* MODEL DETAIL */
.model-hero{height:260px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);font-size:110px}
.model-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-hero .tag{position:absolute;top:20px;left:20px;background:rgba(255,149,0,.82);
  backdrop-filter:var(--blur-glass-sm);-webkit-backdrop-filter:var(--blur-glass-sm);color:#fff;
  font-size:12px;font-weight:800;padding:7px 14px;border-radius:var(--radius-pill);z-index:2;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 2px 8px rgba(255,149,0,.25)}
.model-hero .tag.tag-dark{background:rgba(28,28,30,.78);border-color:rgba(255,255,255,.15)}
.detail-h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;color:var(--label);line-height:1.2}
.detail-tagline{font-size:15px;color:var(--accent-2);font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
.detail-desc{font-size:15px;color:var(--label-2);margin-bottom:20px;line-height:1.55}
.detail-h3{font-size:17px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em;color:var(--label)}
.highlights{list-style:none;background:var(--surface);border-radius:var(--radius-card);padding:0;
  margin-bottom:20px;box-shadow:var(--shadow-card);overflow:hidden}
.highlights li{font-size:14.5px;color:var(--label);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.highlights li + li{border-top:1px solid var(--separator)}
.highlights li::before{content:"✓";color:var(--accent);font-weight:800;flex-shrink:0;
  width:20px;height:20px;border-radius:50%;background:var(--accent-soft);
  display:grid;place-items:center;font-size:12px;margin-top:1px}
.cta-block{display:grid;gap:10px;margin-bottom:24px}
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--wa);color:#fff;font-weight:700;font-size:15.5px;
  letter-spacing:-.01em;padding:16px;border-radius:var(--radius-button);
  transition:transform .2s var(--spring),background .15s;
  cursor:pointer;text-align:center;
  box-shadow:0 4px 12px rgba(37,211,102,.2),0 1px 2px rgba(0,0,0,.08);
  position:relative;
}
.wa-btn:active{background:var(--wa-2);transform:scale(.97)}
.wa-btn-outline{background:var(--surface);color:var(--label);box-shadow:var(--shadow-card)}
.wa-btn-outline:active{background:var(--surface-2)}

/* HARGA CARD */
.harga-card{
  background:var(--surface);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:20px;
}
.harga-section{padding:16px 18px}
.harga-section + .harga-section{border-top:1px solid var(--separator)}
.harga-label{
  font-size:11px;font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.harga-value{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--label);line-height:1.1}
.harga-value small{font-size:13px;font-weight:600;color:var(--label-3);margin-left:2px}
.harga-note{font-size:12px;color:var(--label-2);margin-top:6px;line-height:1.45}
.harga-cta{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px;background:var(--accent-soft);color:var(--accent-2);
  font-weight:700;font-size:13.5px;border:none;width:100%;cursor:pointer;
  transition:background .15s;font-family:inherit;letter-spacing:-.01em;
  position:relative;
}
.harga-cta:active{background:rgba(255,149,0,.2)}

/* FILTER BAR (stok & kredit) */
.filter-bar{padding:16px 0 12px;margin-bottom:4px}
.search-wrap{margin-bottom:10px}
.search-input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:none;background:var(--surface);
  box-shadow:var(--shadow-card);
  font-size:14px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
  color:var(--label);
}
.search-input::placeholder{color:var(--label-3)}
.cat-tabs{
  display:flex;gap:8px;overflow-x:auto;
  padding:2px 20px 6px;margin:0 -20px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;padding:9px 15px;border-radius:99px;
  background:var(--surface);border:1px solid rgba(0,0,0,.06);
  font-size:13px;font-weight:600;cursor:pointer;
  color:var(--label-2);transition:all .2s;
  font-family:inherit;
}
.cat-chip.is-active{
  background:var(--label);color:#fff;border-color:var(--label);
}
.cat-chip:active{transform:scale(.96)}

/* STOK ITEMS */
.stok-group{margin-bottom:20px}
.stok-group-title{
  font-size:12px;font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.05em;
  padding:0 0 8px;margin-top:8px;
}
.stok-item{
  display:flex;align-items:center;gap:12px;
  padding:14px;border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow-card);
  margin-bottom:8px;cursor:pointer;
  transition:transform .15s;
}
.stok-item:active{transform:scale(.985)}
.stok-item-emoji{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent-soft);display:grid;place-items:center;
  font-size:20px;flex-shrink:0;
}
.stok-item-info{flex:1;min-width:0}
.stok-item-info strong{
  display:block;font-size:14.5px;font-weight:700;
  letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stok-item-info span{
  display:block;font-size:13px;font-weight:700;
  color:var(--accent-2);margin-top:2px;
}
.stok-item-cta{
  flex-shrink:0;width:38px;height:38px;
  border-radius:50%;background:var(--wa);color:#fff;
  display:grid;place-items:center;
}
.stok-item-cta svg{width:18px;height:18px}

/* EMPTY STATE */
.empty-state{
  padding:40px 20px;text-align:center;
  color:var(--label-2);font-size:14px;
}

/* KREDIT ACCORDION */
.kredit-card{
  background:var(--surface);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);overflow:hidden;
  margin-bottom:10px;
  scroll-margin-top:80px;
}
.kredit-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;cursor:pointer;width:100%;
  background:transparent;border:none;text-align:left;
  font-family:inherit;color:inherit;
  transition:background .15s;
}
.kredit-head:active{background:var(--surface-2)}
.kredit-emoji{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent-soft);display:grid;place-items:center;
  font-size:21px;flex-shrink:0;
}
.kredit-info{flex:1;min-width:0}
.kredit-info strong{display:block;font-size:14.5px;font-weight:700;
  letter-spacing:-.01em;color:var(--label);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kredit-info .kredit-mulai{
  display:block;font-size:12.5px;color:var(--accent-2);
  font-weight:700;margin-top:2px;letter-spacing:-.01em;
}
.kredit-info .kredit-otr{
  display:block;font-size:11.5px;color:var(--label-3);
  font-weight:500;margin-top:2px;
}
.kredit-chevron{
  width:24px;height:24px;display:grid;place-items:center;
  color:var(--label-3);font-size:20px;
  transition:transform .3s var(--spring),color .2s;
  flex-shrink:0;font-weight:300;
}
.kredit-card.open .kredit-chevron{transform:rotate(90deg);color:var(--accent)}
.kredit-detail{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.32,.72,0,1);
}
.kredit-card.open .kredit-detail{grid-template-rows:1fr}
.kredit-detail-inner{overflow:hidden;min-height:0}
.kredit-body{
  padding:0 16px 16px;
  border-top:1px solid var(--separator);
  margin-top:2px;
}
.kredit-body-inner{padding-top:14px}

/* DP SELECT */
.dp-label{
  display:block;font-size:11px;font-weight:700;
  color:var(--label-2);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:6px;
}
.dp-select{
  width:100%;padding:12px 14px;border-radius:12px;
  border:1px solid rgba(0,0,0,.08);background:var(--bg);
  font-size:14px;font-weight:600;font-family:inherit;
  color:var(--label);margin-bottom:14px;
  -webkit-appearance:none;appearance:none;

  let min = null;

      if (min === null || c < min.cicilan) min = { dp: +dp, tenor: +tenor, cicilan: c };

  }
  return min;
}

function getDpOptions(model) {
  return Object.keys(model.tabel).map(Number).sort((a,b)=>a-b);

function getDefaultDp(model) {
  const opts = getDpOptions(model);
  if (!opts.length) return null;
  const target = (model.harga || 0) * 0.20;
  return opts.reduce((best, cur) =>
    Math.abs(cur - target) < Math.abs(best - target) ? cur : best, opts[0]);
}

function getTenors(model, dp) {
  const t = model.tabel[String(dp)];

function setupStickyHeads(screen) {
  const heads = screen.querySelectorAll('.section-head');
  if (!heads.length) return;
  const onScroll = () => {
    if (!screen.classList.contains('is-active')) return;
    heads.forEach(head => {
      const rect = head.getBoundingClientRect();
      head.classList.toggle('is-stuck', rect.top <= 1 && rect.top >= -1);
    });
  };
  screen.addEventListener('scroll', onScroll, { passive: true });
  screen._stickyOnScroll = onScroll;
}

        <div class="harga-label">Harga OTR</div>
        <div class="harga-value">${formatRp(data.harga)}</div>
      </div>
      ${cicilanMin ? `
        <div class="harga-section">
          <div class="harga-label">Cicilan Mulai</div>
          <div class="harga-value">${formatRp(cicilanMin.cicilan)}<small>/bln</small></div>
          <div class="harga-note">Tenor ${cicilanMin.tenor} bulan · DP ${formatRp(cicilanMin.dp)}</div>
        </div>
      ` : ''}
      <a class="harga-cta" data-nav="/kredit" data-expand-kredit="${esc(name)}">
        Lihat Semua Simulasi Kredit →
      </a>
    </div>
  `;
}

function renderModelDetail(name) {
  const data = getModelData(name);
  if (!data) return renderNotFound();
  const meta = getModelMeta(name);
  return `
    ${renderBackHeader(name)}
    <div class="model-hero anim-in">
      ${imgTag(getImageForModel(name), name)}
      ${meta.tag ? `<span class="tag${meta.tag === 'PREMIUM' ? ' tag-dark' : ''}">${meta.tag}</span>` : ''}
      <span>${meta.emoji}</span>
    </div>
    <div class="wrap" style="padding-top:24px">
      <h2 class="detail-h2 anim-in">${esc(name)}</h2>
      <p class="detail-tagline anim-in">${esc(meta.tagline)}</p>
      <p class="detail-desc anim-in">${esc(meta.description)}</p>
      ${renderHargaCard(name)}
      <div class="anim-in">
        <h3 class="detail-h3">Keunggulan</h3>
        <ul class="highlights">${meta.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
      </div>
      <div class="cta-block anim-in">
        <a class="wa-btn" data-msg="Halo Dion, saya dari TikTok. Mau tanya stok & harga ${esc(name)}.">💬 Tanya Stok & Harga</a>
      </div>
    </div>
  `;
}

/* ============================================================
   RENDER — STOK PAGE
   ============================================================ */
const stokFilter = { q: '', cat: 'all' };
const kreditFilter = { q: '', cat: 'all' };

function filterModelsByState(f) {
  let names = getAllModelNames();
  if (f.cat !== 'all') {
    const cat = CATEGORIES.find(c => c.key === f.cat);
    if (cat) names = names.filter(n => cat.models.includes(n));
  }
  if (f.q) {
    const q = f.q.toLowerCase();
    names = names.filter(n => n.toLowerCase().includes(q));
  }
  return names;
}

function renderFilterBar(f, prefix) {
  return `
    <div class="filter-bar">
      <div class="search-wrap">
        <input type="search" class="search-input" data-search="${prefix}"
               placeholder="Cari model... (mis. Beat, Vario, PCX)"
               value="${esc(f.q)}" autocomplete="off">
      </div>
      <div class="cat-tabs">
        <button class="cat-chip${f.cat === 'all' ? ' is-active' : ''}" data-cat="${prefix}:all">Semua</button>
        ${CATEGORIES.map(c => `
          <button class="cat-chip${f.cat === c.key ? ' is-active' : ''}" data-cat="${prefix}:${c.key}">${esc(c.label)}</button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderStokList() {
  const names = filterModelsByState(stokFilter);
  if (!names.length) {
    return `<div class="empty-state">Tidak ada model yang cocok. Coba kata kunci lain.</div>`;
  }
  return names.map(name => {
    const data = getModelData(name);
    if (!data) return '';
    const meta = getModelMeta(name);
    const safeName = esc(name);
    return `
      <a class="stok-item" data-msg="Halo Dion, saya dari TikTok. Mau tanya stok & harga ${safeName}.">
        <div class="stok-item-emoji">${meta.emoji}</div>
        <div class="stok-item-info">
          <strong>${esc(name)}</strong>
          <span>OTR ${formatRp(data.harga)}</span>
        </div>
        <div class="stok-item-cta">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.83.98h.01a7.94 7.94 0 0 0 5.56-13.56Z"/></svg>
        </div>
      </a>
    `;
  }).join('');
}

function renderStok() {
  return `
    ${renderBackHeader('Stok & Harga')}
    <div class="wrap" style="padding-top:8px">
      <p class="detail-desc anim-in" style="margin-bottom:4px">Daftar harga OTR semua model Honda. Tanya ketersediaan warna/tipe via WhatsApp.</p>
      ${renderFilterBar(stokFilter, 'stok')}
      <div id="stok-list-container" class="anim-in">${renderStokList()}</div>
    </div>
  `;
}

/* ============================================================
   RENDER — KREDIT PAGE
   ============================================================ */
function renderTenorRows(name, dp) {
  const data = getModelData(name);
  if (!data) return '';
  const tenors = getTenors(data, dp);
  const tbl = data.tabel[String(dp)] || {};
  return tenors.map(t => `
    <div class="tenor-row">
      <div class="tenor-dur">${t} bulan</div>
      <div class="tenor-cicilan">${formatRp(tbl[t])}<small>/bln</small></div>
    </div>
  `).join('');
}

function renderDpSelect(name, defaultDp) {
  const data = getModelData(name);
  if (!data) return '';
  const opts = getDpOptions(data);
  return `
    <label class="dp-label">Pilih DP</label>
    <select class="dp-select" data-model="${esc(name)}">
      ${opts.map(dp => `
        <option value="${dp}"${dp === defaultDp ? ' selected' : ''}>DP ${formatRp(dp)}</option>
      `).join('')}
    </select>
  `;
}

function renderKreditCardsList() {
  const names = filterModelsByState(kreditFilter);
  if (!names.length) {
    return `<div class="empty-state">Tidak ada model yang cocok. Coba kata kata lain.</div>`;
  }
  return names.map(name => {
    const data = getModelData(name);
    if (!data) return '';
    const meta = getModelMeta(name);
    const cicilanMin = getMinCicilan(data);
    const defaultDp = getDefaultDp(data);
    return `
      <div class="kredit-card" data-kredit-card="${esc(name)}">
        <button class="kredit-head" data-toggle-kredit="${esc(name)}" type="button">
          <div class="kredit-emoji">${meta.emoji}</div>
          <div class="kredit-info">
            <strong>${esc(name)}</strong>
            ${cicilanMin
              ? `<span class="kredit-mulai">Mulai ${formatRp(cicilanMin.cicilan)}/bln</span>`
              : `<span class="kredit-mulai" style="color:var(--label-3)">Belum tersedia</span>`}
            <span class="kredit-otr">OTR ${formatRp(data.harga)}</span>
          </div>
          <div class="kredit-chevron">›</div>
        </button>
        <div class="kredit-detail">
          <div class="kredit-detail-inner">
            <div class="kredit-body">
              <div class="kredit-body-inner">
                ${renderDpSelect(name, defaultDp)}
                <div class="tenor-list" data-tenor-list="${esc(name)}">
                  ${renderTenorRows(name, defaultDp)}
                </div>
                <a class="wa-btn" data-msg="Halo Dion, saya dari TikTok. Mau konsultasi kredit ${esc(name)}.">💬 Konsultasi Kredit</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderKredit() {
  return `
    ${renderBackHeader('Simulasi Kredit')}
    <div class="wrap" style="padding-top:8px">
      <p class="detail-desc anim-in" style="margin-bottom:4px">Pilih model & DP untuk lihat cicilan per tenor. Angka dari pricelist FIFGROUP.</p>
      ${renderFilterBar(kreditFilter, 'kredit')}
      <div id="kredit-list-container" class="anim-in">${renderKreditCardsList()}</div>
    </div>
  `;
}

function renderNotFound() {
  return `
    ${renderBackHeader('Tidak Ditemukan')}
    <div class="not-found">
      <h2>Halaman tidak ditemukan</h2>
      <p>Halaman yang Anda cari tidak tersedia.</p>
      <a class="wa-btn" data-back>← Kembali</a>
    </div>
  `;
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderRoute(route) {
  if (route === '/') return renderHome();
  if (route.startsWith('/model/')) {
    const name = decodeURIComponent(route.slice(7));
    return renderModelDetail(name);
  }
  if (route === '/stok') return renderStok();
  if (route === '/kredit') return renderKredit();
  return renderNotFound();
}

function routeToHash(route) {
  if (route.startsWith('/model/')) {
    return '/model/' + encodeURIComponent(route.slice(7));
  }
  return route;
}
function hashToRoute(hash) {
  const path = hash.startsWith('#') ? hash.slice(1) : hash;
  if (path.startsWith('/model/')) {
    return '/model/' + decodeURIComponent(path.slice(7));
  }
  return path || '/';
}

/* ============================================================
   NAVIGATION ENGINE
   ============================================================ */
function makeScreen(route) {
  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.route = route;
  el.innerHTML = renderRoute(route);
  const onScroll = () => {
    if (!el.classList.contains('is-active')) return;
    updateFloatWa(el);
  };
  el.addEventListener('scroll', onScroll, { passive: true });
  el._onScroll = onScroll;
  setupStickyHeads(el);
  return el;
}

function pushScreen(route, animate) {
  if (animate && animating) return;
  const current = stack[stack.length - 1];
  const el = makeScreen(route);
  app.appendChild(el);

  const afterActivate = () => {
    animating = false;
    updateFloatWa(el);
    if (pendingKreditModel && route === '/kredit') {
      const target = pendingKreditModel;
      pendingKreditModel = null;
      setTimeout(() => expandKreditModel(el, target), 120);
    }
  };

  if (animate && current) {
    animating = true;
    void el.offsetWidth;
    current.classList.remove('is-active');
    current.classList.add('is-behind');
    el.classList.add('is-active');
    setTimeout(afterActivate, NAV_DURATION);
  } else if (animate) {
    animating = true;
    el.classList.add('is-active');
    setTimeout(afterActivate, NAV_DURATION);
  } else {
    el.classList.add('no-transition', 'is-active');
    requestAnimationFrame(() => {
      el.classList.remove('no-transition');
      afterActivate();
    });
  }
  stack.push(el);
}

function popScreen(animate) {
  if (animate && animating) return;
  if (stack.length <= 1) return;
  const current = stack.pop();
  const prev = stack[stack.length - 1];
  if (animate) {
    animating = true;
    current.classList.remove('is-active');
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    setTimeout(() => {
      if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
      current.remove();
      animating = false;
      updateFloatWa(prev);
    }, NAV_DURATION);
  } else {
    if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
    current.remove();
    prev.classList.remove('is-behind');
    prev.classList.add('is-active');
    updateFloatWa(prev);
  }
}

function navigate(route) {
  if (animating) return;
  const current = stack[stack.length - 1];
  if (current && current.dataset.route === route) return;
  history.pushState({ index: stack.length, route }, '', '#' + routeToHash(route));
  pushScreen(route, true);
}

function refreshActiveList(prefix) {
  const screen = stack[stack.length - 1];
  if (!screen) return;
  if (prefix === 'stok') {
    const c = screen.querySelector('#stok-list-container');
    if (c) c.innerHTML = renderStokList();
  } else if (prefix === 'kredit') {
    const c = screen.querySelector('#kredit-list-container');
    if (c) c.innerHTML = renderKreditCardsList();
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
app.addEventListener('click', e => {
  if (animating) return;

  // Toggle accordion
  const toggleEl = e.target.closest('[data-toggle-kredit]');
  if (toggleEl) {
    e.preventDefault();
    const card = toggleEl.closest('.kredit-card');
    if (!card) return;
    const wasOpen = card.classList.contains('open');
    card.parentElement.querySelectorAll('.kredit-card.open').forEach(c => {
      if (c !== card) c.classList.remove('open');
    });
    card.classList.toggle('open', !wasOpen);
    return;
  }

  // Category chip
  const catEl = e.target.closest('[data-cat]');
  if (catEl) {
    e.preventDefault();
    const [prefix, cat] = catEl.dataset.cat.split(':');
    const target = prefix === 'stok' ? stokFilter : kreditFilter;
    target.cat = cat;
    // Update active state
    catEl.parentElement.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('is-active'));
    catEl.classList.add('is-active');
    refreshActiveList(prefix);
    return;
  }

  // Navigasi
  const navEl = e.target.closest('[data-nav]');
  if (navEl) {
    e.preventDefault();
    const expandTarget = navEl.dataset.expandKredit;
    if (expandTarget) pendingKreditModel = expandTarget;
    navigate(navEl.dataset.nav);
    return;
  }

  const backEl = e.target.closest('[data-back]');
  if (backEl) { e.preventDefault(); if (stack.length > 1) history.back(); return; }

  const msgEl = e.target.closest('[data-msg]');
  if (msgEl) { e.preventDefault(); openWa(msgEl.dataset.msg, msgEl); return; }
});

// DP select change
app.addEventListener('change', e => {
  if (e.target.matches('.dp-select')) {
    const name = e.target.dataset.model;
    const dp = e.target.value;
    const card = e.target.closest('.kredit-card');
    if (!card) return;
    const tenorList = card.querySelector('[data-tenor-list]');
    if (tenorList) tenorList.innerHTML = renderTenorRows(name, dp);
  }
});

// Search input
let searchTimer;
app.addEventListener('input', e => {
  if (e.target.matches('.search-input')) {
    const prefix = e.target.dataset.search;
    const target = prefix === 'stok' ? stokFilter : kreditFilter;
    target.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => refreshActiveList(prefix), 150);
  }
});

floatWa.addEventListener('click', e => {
  e.preventDefault();
  openWa(CONFIG.defaultMessage, e.currentTarget);
});

window.addEventListener('popstate', e => {
  const state = e.state || { index: 0, route: '/' };
  const targetIndex = state.index;
  const currentIndex = stack.length - 1;
  if (targetIndex === currentIndex) return;
  if (targetIndex < currentIndex) popScreen(true);
  else if (state.route) pushScreen(state.route, true);
});

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const initialRoute = hashToRoute(location.hash) || '/';
  history.replaceState({ index: 0, route: '/' }, '', '#/');
  const homeEl = makeScreen('/');
  homeEl.classList.add('no-transition', 'is-active');
  app.appendChild(homeEl);
  stack.push(homeEl);
  if (initialRoute !== '/' && initialRoute !== '') {
    history.pushState({ index: 1, route: initialRoute }, '', '#' + routeToHash(initialRoute));
    const detailEl = makeScreen(initialRoute);
    detailEl.classList.add('no-transition', 'is-active');
    homeEl.classList.remove('is-active');
    homeEl.classList.add('is-behind');
    app.appendChild(detailEl);
    stack.push(detailEl);
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(detailEl);
    });
  } else {
    requestAnimationFrame(() => {
      document.querySelectorAll('.no-transition').forEach(el => el.classList.remove('no-transition'));
      updateFloatWa(homeEl);
    });
  }
})();
</script>
