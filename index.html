<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dion Prayoga — Sales Honda Bandung</title>
<meta name="theme-color" content="#1c1c1e">
<style>
:root{
  --bg:#f2f2f7;
  --bg-glass:rgba(242,242,247,0.82);
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --label:#1c1c1e;
  --label-2:#6b6b70;
  --label-3:#8e8e93;
  --separator:rgba(60,60,67,0.08);
  --fill:rgba(120,120,128,0.08);
  --fill-2:rgba(120,120,128,0.14);
  --accent:#ff9f0a;
  --accent-2:#ff8c00;
  --accent-text:#1c1c1e;
  --accent-soft:rgba(255,159,10,0.14);
  --wa:#25d366;
  --wa-2:#1da851;
  --wa-glass:rgba(37,211,102,0.9);
  --glass-blur:blur(24px) saturate(180%);
  --glass-blur-sm:blur(16px) saturate(180%);
  --shadow-liquid:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 1px 2px rgba(0,0,0,0.03),
    0 4px 12px rgba(0,0,0,0.04),
    0 16px 32px rgba(0,0,0,0.05);
  --shadow-liquid-sm:
    inset 0 1px 0 rgba(255,255,255,0.85),
    0 1px 2px rgba(0,0,0,0.03),
    0 8px 20px rgba(0,0,0,0.05);
  --shadow-float:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 8px 24px rgba(37,211,102,.4),
    0 2px 8px rgba(0,0,0,.12);
  --radius-card:20px;
  --radius-button:14px;
  --radius-pill:999px;
  --radius-hero:28px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --nav-duration:380ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;color:var(--label);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;overscroll-behavior:none;
  font-size:15px;
  letter-spacing:-0.01em;
}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
button,a{touch-action:manipulation}
button{font-family:inherit}

/* ================= SCREEN — solid bg, no bleed-through ================= */
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:
    radial-gradient(ellipse at 15% 3%,rgba(255,159,10,0.05) 0%,transparent 45%),
    radial-gradient(ellipse at 85% 97%,rgba(88,86,214,0.04) 0%,transparent 40%),
    var(--bg);
  transform:translateX(100%);
  visibility:hidden;
  will-change:transform;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    visibility 0s linear var(--nav-duration);
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
.screen.is-active{
  transform:translateX(0);
  visibility:visible;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    visibility 0s linear 0s;
}
.screen.is-behind{
  transform:translateX(-25%);
  visibility:visible;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    visibility 0s linear 0s;
}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen.is-active .anim-in{animation:fadeInUp .45s var(--smooth) both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.wrap{max-width:520px;margin:0 auto;padding:0 18px}
a{color:inherit;text-decoration:none}

.is-loading{pointer-events:none;position:relative;color:transparent!important}
.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
.wa-btn.is-loading::after,.wa-btn.is-loading{color:transparent}
.wa-btn.is-loading::after{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.hero-cta.is-loading{color:transparent!important}
.hero-cta.is-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--label)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= HERO ================= */
.hero{
  background:
    radial-gradient(ellipse at 75% 15%,rgba(255,159,10,0.28) 0%,transparent 50%),
    radial-gradient(ellipse at 15% 85%,rgba(255,120,0,0.15) 0%,transparent 45%),
    linear-gradient(180deg,#1c1c1e 0%,#2c2c2e 100%);
  color:#fff;
  padding:calc(20px + env(safe-area-inset-top)) 0 26px;
  position:relative;overflow:hidden;
  border-bottom-left-radius:var(--radius-hero);
  border-bottom-right-radius:var(--radius-hero);
  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.14);
}
.hero::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,0.08) 0%,transparent 55%);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;position:relative}
.hero-profile{display:flex;align-items:center;gap:11px;min-width:0;flex:1;position:relative}
.profile-avatar{
  width:46px;height:46px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#ffb84d 0%,#ff8500 100%);
  color:#fff;display:grid;place-items:center;
  font-size:19px;font-weight:700;
  flex-shrink:0;position:relative;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 4px 12px rgba(255,159,10,.35);
}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0}
.profile-info strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.01em;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.profile-info span{
  display:block;font-size:11.5px;
  color:rgba(255,255,255,.62);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.1);
  border:0.5px solid rgba(255,255,255,0.18);
  padding:5px 10px;border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h1{
  font-size:28px;line-height:1.12;font-weight:800;
  letter-spacing:-.03em;margin-bottom:8px;position:relative;
}
.hero p{
  font-size:15px;color:rgba(255,255,255,.72);
  margin-bottom:22px;line-height:1.45;position:relative;
  letter-spacing:-.005em;
}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  font-weight:700;font-size:16px;letter-spacing:-.01em;
  padding:16px;border-radius:var(--radius-button);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 1px 2px rgba(0,0,0,0.1),
    0 4px 12px rgba(255,159,10,0.35),
    0 12px 28px rgba(255,159,10,0.22);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;position:relative;
}
.hero-cta:active{
  transform:scale(.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 1px 2px rgba(0,0,0,0.1),
    0 2px 6px rgba(255,159,10,0.3);
}

/* ================= SECTIONS ================= */
section{padding:6px 0 0}
.section-head{
  position:sticky;top:0;z-index:5;
  padding:18px 18px 10px;margin:0 -18px 8px;
  background:rgba(242,242,247,0.72);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 -0.5px 0 rgba(60,60,67,0.08);
  transition:box-shadow .2s ease;
}
.section-head.is-stuck{
  box-shadow:
    inset 0 -0.5px 0 rgba(60,60,67,0.08),
    0 1px 12px rgba(0,0,0,0.03);
}
.section-title{
  font-size:20px;font-weight:800;
  letter-spacing:-.025em;margin-bottom:2px;color:var(--label);
  line-height:1.25;
}
.section-sub{
  font-size:13px;color:var(--label-2);
  margin:0;letter-spacing:-.005em;line-height:1.35;
}

/* ================= SOCIALS ================= */
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.social{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;border-radius:16px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
  transition:transform .2s var(--spring);
  cursor:pointer;
}
.social:active{transform:scale(.94)}
.social-icon{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.social-icon svg{width:19px;height:19px}
.social-tiktok .social-icon{background:#000}
.social-ig .social-icon{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social-yt .social-icon{background:#ff0000}
.social span{
  font-size:11px;font-weight:600;color:var(--label);
  text-align:center;line-height:1.2;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ================= ACTIONS ================= */
.actions{display:grid;gap:9px}
.action{
  display:flex;align-items:center;gap:14px;padding:15px;
  border-radius:var(--radius-card);
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
  transition:transform .2s var(--spring);
  cursor:pointer;
}
.action:active{transform:scale(.98)}
.action-ico{
  width:46px;height:46px;border-radius:12px;
  background:var(--accent-soft);
  display:grid;place-items:center;font-size:22px;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
}
.action-body{flex:1;min-width:0}
.action-body strong{
  display:block;font-size:16px;font-weight:700;
  letter-spacing:-.015em;color:var(--label);line-height:1.25;
}
.action-body span{
  display:block;font-size:13px;color:var(--label-2);
  margin-top:2px;letter-spacing:-.005em;line-height:1.35;
}
.action-arrow{color:var(--label-3);font-size:20px;font-weight:300}

/* ================= MODELS ================= */
.models{display:grid;gap:12px}
.model{
  border-radius:var(--radius-card);overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
  transition:transform .2s var(--spring);
  cursor:pointer;display:block;
}
.model:active{transform:scale(.98)}
.model-img{
  height:150px;display:grid;place-items:center;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);
  font-size:56px;
}
.model-img::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0.04) 0%,transparent 30%,transparent 70%,rgba(0,0,0,0.02) 100%);
}
.model-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-img .tag{
  position:absolute;top:12px;left:12px;
  background:rgba(255,159,10,0.94);
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:10.5px;font-weight:800;
  padding:5px 10px;border-radius:var(--radius-pill);
  letter-spacing:.04em;z-index:2;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 2px 8px rgba(255,159,10,.35);
}
.model-img .tag.tag-dark{
  background:rgba(28,28,30,0.85);
  border-color:rgba(255,255,255,0.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 2px 8px rgba(0,0,0,.25);
}
.model-body{padding:15px 17px 17px}
.model-body h3{
  font-size:17px;font-weight:800;
  letter-spacing:-.02em;margin-bottom:4px;color:var(--label);
  line-height:1.3;
}
.model-body p{
  font-size:13px;color:var(--label-2);
  margin-bottom:10px;line-height:1.45;
}
.model-body .model-price{
  font-size:15px;font-weight:700;color:var(--accent-2);
  margin-bottom:12px;letter-spacing:-.015em;
}
.model-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  font-weight:700;font-size:14px;letter-spacing:-.015em;
  padding:11px 16px;border-radius:11px;
  width:100%;justify-content:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 2px 6px rgba(255,159,10,.25);
  transition:transform .15s,box-shadow .15s;
}
.model:active .model-btn{
  transform:scale(.98);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4);
}

/* ================= TRUST ================= */
.trust{
  border-radius:var(--radius-card);overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
}
.trust-item{display:flex;gap:14px;align-items:flex-start;padding:15px 17px}
.trust-item + .trust-item{border-top:0.5px solid var(--separator)}
.trust-ico{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;
  font-size:13px;font-weight:800;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.trust-item strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.01em;color:var(--label);line-height:1.3;
}
.trust-item span{
  display:block;font-size:13px;color:var(--label-2);
  margin-top:3px;line-height:1.45;
}

/* ================= TERMS ================= */
.terms{
  border-radius:var(--radius-card);padding:15px 17px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
}
.terms h3{
  font-size:13px;font-weight:700;color:var(--label);
  letter-spacing:-.01em;margin-bottom:6px;
}
.terms p{font-size:12.5px;color:var(--label-2);line-height:1.55}

/* ================= DETAIL HEADER ================= */
.detail-header{
  position:sticky;top:0;z-index:10;
  background:rgba(242,242,247,0.78);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 -0.5px 0 rgba(60,60,67,0.08);
  display:flex;align-items:center;padding:8px 12px;gap:6px;
  padding-top:calc(8px + env(safe-area-inset-top));
}
.back-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(120,120,128,0.1);
  border:0.5px solid rgba(255,255,255,0.4);
  display:grid;place-items:center;cursor:pointer;
  color:var(--label);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 1px 3px rgba(0,0,0,.05);
  transition:transform .2s var(--spring),background .15s;
  flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
}
.back-btn:active{background:rgba(120,120,128,0.18);transform:scale(.93)}
.detail-title{
  flex:1;font-size:16px;font-weight:700;
  text-align:center;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--label);
}

/* ================= MODEL DETAIL ================= */
.model-hero{
  height:240px;display:grid;place-items:center;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);
  font-size:100px;
}
.model-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-hero .tag{
  position:absolute;top:20px;left:20px;
  background:rgba(255,159,10,0.94);
  backdrop-filter:var(--glass-blur-sm);
  -webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:11px;font-weight:800;
  padding:6px 12px;border-radius:var(--radius-pill);
  z-index:2;letter-spacing:.03em;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 2px 10px rgba(255,159,10,.3);
}
.model-hero .tag.tag-dark{background:rgba(28,28,30,0.85);border-color:rgba(255,255,255,0.18)}
.detail-h2{
  font-size:26px;font-weight:800;
  letter-spacing:-.03em;margin-bottom:4px;
  color:var(--label);line-height:1.2;
}
.detail-tagline{
  font-size:15px;color:var(--accent-2);
  font-weight:600;margin-bottom:16px;letter-spacing:-.01em;
}
.detail-desc{
  font-size:14px;color:var(--label-2);
  margin-bottom:20px;line-height:1.55;
}
.detail-h3{
  font-size:17px;font-weight:800;
  margin-bottom:10px;letter-spacing:-.02em;color:var(--label);
}
.highlights{
  list-style:none;border-radius:var(--radius-card);padding:0;
  margin-bottom:20px;overflow:hidden;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
}
.highlights li{
  font-size:15px;color:var(--label);
  padding:14px 17px;
  display:flex;gap:11px;align-items:flex-start;
  line-height:1.4;
}
.highlights li + li{border-top:0.5px solid var(--separator)}
.highlights li::before{
  content:"✓";color:var(--accent-2);font-weight:800;flex-shrink:0;
  width:21px;height:21px;border-radius:50%;
  background:var(--accent-soft);display:grid;place-items:center;
  font-size:11px;margin-top:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.cta-block{display:grid;gap:9px;margin-bottom:22px}

/* ================= WA BUTTON ================= */
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#31d977 0%,#25d366 100%);
  color:#fff;font-weight:700;font-size:16px;
  letter-spacing:-.01em;padding:15px;border-radius:var(--radius-button);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;text-align:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 1px 2px rgba(0,0,0,0.08),
    0 4px 12px rgba(37,211,102,0.25);
  position:relative;border:none;font-family:inherit;width:100%;
}
.wa-btn:active{
  transform:scale(.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 1px 2px rgba(0,0,0,0.08),
    0 2px 6px rgba(37,211,102,0.2);
}
.wa-btn-outline{
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  color:var(--label);
  box-shadow:var(--shadow-liquid-sm);
  border:0.5px solid rgba(0,0,0,0.04);
}
.wa-btn-outline:active{background:var(--surface-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.wa-btn.has-selection{
  background:linear-gradient(180deg,#1da851 0%,#148a3f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 0 0 4px rgba(37,211,102,0.16),
    0 4px 12px rgba(37,211,102,0.35);
  animation:btnPulse .45s var(--smooth) 1;
}
.wa-btn.promo-ready{
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 0 0 4px rgba(255,159,10,0.2),
    0 4px 12px rgba(255,159,10,0.35);
  animation:btnPulse .45s var(--smooth) 1;
}
@keyframes btnPulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

/* ================= HARGA CARD ================= */
.harga-card{
  border-radius:var(--radius-card);overflow:hidden;
  margin-bottom:20px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
}
.harga-section{padding:15px 17px}
.harga-section + .harga-section{border-top:0.5px solid var(--separator)}
.harga-label{
  font-size:11px;font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;
}
.harga-value{
  font-size:24px;font-weight:800;
  letter-spacing:-.025em;color:var(--label);line-height:1.1;
}
.harga-value small{font-size:13px;font-weight:600;color:var(--label-3);margin-left:2px}
.harga-note{font-size:12px;color:var(--label-2);margin-top:5px;line-height:1.45}
.harga-cta{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:14px;background:var(--accent-soft);color:var(--accent-2);
  font-weight:700;font-size:14px;border:none;width:100%;cursor:pointer;
  transition:background .15s;font-family:inherit;letter-spacing:-.01em;
  position:relative;
}
.harga-cta:active{background:rgba(255,159,10,0.2)}

/* ================= FILTER ================= */
.filter-bar{padding:14px 0 10px;margin-bottom:4px}
.search-wrap{margin-bottom:9px}
.search-input{
  width:100%;padding:12px 15px;border-radius:12px;
  border:0.5px solid rgba(0,0,0,0.04);
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  box-shadow:var(--shadow-liquid-sm);
  font-size:15px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
  color:var(--label);letter-spacing:-.005em;
}
.search-input::placeholder{color:var(--label-3)}
.search-input:focus{
  outline:none;
  box-shadow:var(--shadow-liquid-sm),0 0 0 3px rgba(255,159,10,0.18);
}
.cat-tabs{
  display:flex;gap:7px;overflow-x:auto;
  padding:2px 18px 4px;margin:0 -18px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;padding:8px 15px;border-radius:var(--radius-pill);
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
  font-size:13px;font-weight:600;cursor:pointer;
  color:var(--label-2);transition:all .25s var(--smooth);
  font-family:inherit;letter-spacing:-.01em;
}
.cat-chip.is-active{
  background:linear-gradient(180deg,#2c2c2e 0%,#1c1c1e 100%);
  color:#fff;border-color:transparent;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    0 1px 2px rgba(0,0,0,0.1),
    0 4px 12px rgba(0,0,0,0.15);
}
.cat-chip:active{transform:scale(.96)}

/* ================= STOK ITEM ================= */
.stok-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;border-radius:16px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid-sm);
  margin-bottom:8px;cursor:pointer;
  transition:transform .15s var(--spring);
  color:inherit;text-decoration:none;
}
.stok-item:active{transform:scale(.985)}
.stok-item-emoji{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent-soft);
  display:grid;place-items:center;font-size:20px;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.stok-item-info{flex:1;min-width:0}
.stok-item-info strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.015em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stok-item-info span{
  display:block;font-size:13px;font-weight:600;
  color:var(--accent-2);margin-top:2px;
}
.stok-item-arrow{
  flex-shrink:0;width:32px;height:32px;
  border-radius:50%;background:rgba(120,120,128,0.08);
  color:var(--label-3);display:grid;place-items:center;
}
.empty-state{padding:36px 20px;text-align:center;color:var(--label-2);font-size:14px}

/* ================= KREDIT CARD ================= */
.kredit-card{
  border-radius:var(--radius-card);overflow:hidden;
  margin-bottom:9px;scroll-margin-top:70px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  box-shadow:var(--shadow-liquid);
}
.kredit-head{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;cursor:pointer;width:100%;
  background:transparent;border:none;text-align:left;
  font-family:inherit;color:inherit;
  transition:background .15s;
}
.kredit-head:active{background:rgba(120,120,128,0.06)}
.kredit-emoji{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent-soft);
  display:grid;place-items:center;font-size:20px;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.kredit-info{flex:1;min-width:0}
.kredit-info strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.015em;color:var(--label);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.25;
}
.kredit-info .kredit-mulai{
  display:block;font-size:12px;color:var(--accent-2);
  font-weight:700;margin-top:2px;letter-spacing:-.01em;
}
.kredit-info .kredit-otr{
  display:block;font-size:11px;color:var(--label-3);
  font-weight:500;margin-top:1px;
}
.kredit-chevron{
  width:24px;height:24px;display:grid;place-items:center;
  color:var(--label-3);font-size:18px;
  transition:transform .3s var(--spring),color .2s;
  flex-shrink:0;font-weight:300;
}
.kredit-card.open .kredit-chevron{transform:rotate(90deg);color:var(--accent-2)}
.kredit-detail{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.32,.72,0,1);
}
.kredit-card.open .kredit-detail{grid-template-rows:1fr}
.kredit-detail-inner{overflow:hidden;min-height:0}
.kredit-body{
  padding:0 15px 15px;
  border-top:0.5px solid var(--separator);
  margin-top:2px;
}
.kredit-body-inner{padding-top:14px}

/* ================= DP SLIDER ================= */
.dp-slider-wrap{
  border-radius:14px;padding:13px 15px;margin-bottom:14px;
  background:rgba(120,120,128,0.06);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.02);
}
.dp-display{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;margin-bottom:6px;
}
.dp-display-label{
  font-size:11px;font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.05em;display:block;
}
.dp-display-sub{
  font-size:10px;font-weight:600;color:var(--label-3);
  letter-spacing:0;display:block;margin-top:2px;text-transform:none;
}
.dp-display-value{
  font-size:20px;font-weight:800;color:var(--accent-2);
  letter-spacing:-.025em;line-height:1.1;
}
.dp-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:6px;border-radius:3px;
  background:rgba(120,120,128,0.2);
  outline:none;cursor:pointer;
  margin:14px 0 8px;touch-action:pan-y;
  transition:opacity .3s ease;
}
.dp-slider::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(to right,
    var(--accent) 0%,
    var(--accent) var(--pct,0%),
    rgba(120,120,128,0.2) var(--pct,0%),
    rgba(120,120,128,0.2) 100%);
}
.dp-slider::-moz-range-track{height:6px;border-radius:3px;background:rgba(120,120,128,0.2)}
.dp-slider::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.dp-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:24px;height:24px;border-radius:50%;
  background:#fff;border:0.5px solid rgba(0,0,0,0.06);
  box-shadow:
    0 1px 2px rgba(0,0,0,0.15),
    0 4px 12px rgba(0,0,0,0.12),
    0 0 0 3px rgba(255,255,255,0.9),
    0 0 0 4px rgba(255,159,10,0.25);
  cursor:pointer;margin-top:-9px;
  transition:transform .15s ease;
}
.dp-slider:active::-webkit-slider-thumb{transform:scale(1.12)}
.dp-slider::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;
  background:#fff;border:0.5px solid rgba(0,0,0,0.06);
  box-shadow:0 2px 8px rgba(0,0,0,0.15),0 0 0 3px rgba(255,255,255,0.9);
  cursor:pointer;
}
.dp-slider-labels{
  display:flex;justify-content:space-between;
  margin-top:2px;transition:opacity .3s ease;
}
.dp-slider-labels span{
  font-size:11px;font-weight:600;
  color:var(--label-3);letter-spacing:-.01em;
}
.dp-note{
  font-size:11.5px;color:var(--label-3);
  margin-top:9px;line-height:1.4;font-style:italic;
  display:flex;align-items:flex-start;gap:4px;
}
.dp-note::before{
  content:"*";color:var(--accent-2);font-weight:700;
  font-size:13px;line-height:1;margin-top:1px;flex-shrink:0;
}

/* ================= PROMO ================= */
.promo-container{display:none;margin-top:0}
.promo-container.is-visible{display:block;animation:slideDown .35s var(--nav-easing) both}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.promo-divider{
  display:flex;align-items:center;gap:10px;
  margin:12px 0 9px;color:var(--label-3);
  font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
}
.promo-divider::before,
.promo-divider::after{content:"";flex:1;height:0.5px;background:rgba(60,60,67,0.14)}
.promo-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:#fff;font-weight:700;font-size:13px;
  padding:12px 15px;border-radius:11px;border:none;cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 1px 2px rgba(0,0,0,0.08),
    0 4px 12px rgba(255,159,10,0.35);
  transition:transform .15s,box-shadow .15s;
  font-family:inherit;letter-spacing:-.015em;
}
.promo-btn:active{
  transform:scale(.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    0 2px 6px rgba(255,159,10,0.3);
}
.promo-view{display:none;margin-bottom:14px}
.promo-banner{
  background:linear-gradient(135deg,rgba(255,159,10,0.16) 0%,rgba(255,159,10,0.06) 100%);
  border:0.5px solid rgba(255,159,10,0.35);
  border-radius:16px;padding:16px;position:relative;overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 4px 16px rgba(255,159,10,0.15);
}
.promo-banner::before{
  content:"";position:absolute;top:-30px;right:-30px;
  width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,159,10,0.25) 0%,transparent 70%);
  pointer-events:none;
}
.promo-banner-label{
  font-size:10.5px;font-weight:800;color:var(--accent-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
  display:flex;align-items:center;gap:4px;position:relative;z-index:1;
}
.promo-banner-value{
  font-size:26px;font-weight:800;color:var(--label);
  letter-spacing:-.03em;line-height:1.1;margin-bottom:6px;
  position:relative;z-index:1;
}
.promo-banner-value small{font-size:12px;font-weight:600;color:var(--label-3);margin-left:2px}
.promo-banner-meta{
  font-size:13px;color:var(--label-2);line-height:1.45;
  font-weight:600;position:relative;z-index:1;
}
.promo-banner-note{
  font-size:11px;color:var(--label-3);font-style:italic;
  line-height:1.5;padding-top:10px;margin-top:10px;
  border-top:0.5px solid rgba(255,159,10,0.2);
  position:relative;z-index:1;
}
.promo-banner-back{
  display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;margin-top:12px;padding:11px;
  background:rgba(255,255,255,0.6);
  color:var(--accent-2);font-weight:700;font-size:12.5px;
  border:0.5px solid rgba(255,159,10,0.4);
  border-radius:11px;cursor:pointer;font-family:inherit;letter-spacing:-.01em;
  transition:background .15s;position:relative;z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}
.promo-banner-back:active{background:rgba(255,255,255,0.85)}
.kredit-card.promo-active .promo-view{display:block}
.kredit-card.promo-active .promo-container{display:none}
.kredit-card.promo-active .tenor-list{display:none}
.kredit-card.promo-active .dp-slider{opacity:.4;pointer-events:none}
.kredit-card.promo-active .dp-slider-labels{opacity:.4}
.kredit-card.promo-active .dp-display-label{color:var(--accent-2)}

/* ================= TENOR LIST ================= */
.tenor-list{
  border-radius:12px;overflow:hidden;margin-bottom:14px;
  background:rgba(120,120,128,0.05);
}
.tenor-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;font-size:13px;
  width:100%;border:none;background:transparent;
  font-family:inherit;text-align:left;color:inherit;
  cursor:pointer;transition:background .2s,box-shadow .2s;
  position:relative;
}
.tenor-row + .tenor-row{border-top:0.5px solid var(--separator)}
.tenor-row:active{background:rgba(120,120,128,0.08)}
.tenor-dur{
  font-weight:700;color:var(--label);font-size:14px;
  letter-spacing:-.015em;flex:1;transition:color .2s;
}
.tenor-cicilan{
  font-weight:800;color:var(--accent-2);font-size:15px;
  letter-spacing:-.02em;display:flex;align-items:baseline;flex-shrink:0;
  transition:color .2s;
}
.tenor-cicilan small{font-weight:600;font-size:11px;color:var(--label-3);margin-left:1px}
.tenor-arrow{
  color:var(--label-3);display:grid;place-items:center;
  flex-shrink:0;margin-left:2px;transition:color .2s;
}
.tenor-row.is-selected{
  background:rgba(255,159,10,0.14);
  box-shadow:inset 3px 0 0 var(--accent);
}
.tenor-row.is-selected .tenor-dur{color:var(--accent-2)}
.tenor-row.is-selected .tenor-cicilan{color:var(--accent-2)}
.tenor-row.is-selected .tenor-arrow{color:var(--accent-2)}

/* ================= FLOAT WA ================= */
.float-wa{
  position:fixed;right:18px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;
  background:var(--wa-glass);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  color:#fff;display:grid;place-items:center;
  box-shadow:var(--shadow-float);
  z-index:100;cursor:pointer;transform-origin:center bottom;
  transition:transform .45s var(--spring),opacity .35s var(--smooth),box-shadow .2s var(--smooth);
  border:0.5px solid rgba(255,255,255,0.3);
}
.float-wa:active{transform:scale(.9)}
.float-wa svg{width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.float-wa.is-hidden{opacity:0;transform:scale(.6) translateY(24px);pointer-events:none;box-shadow:none}

/* ================= SHEET ================= */
.sheet-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--smooth);
  z-index:200;
}
.sheet-backdrop.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  max-width:520px;margin:0 auto;
  background:rgba(252,252,253,0.88);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-top-left-radius:28px;
  border-top-right-radius:28px;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .42s var(--nav-easing);
  z-index:201;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 -8px 40px rgba(0,0,0,0.15),
    0 -2px 8px rgba(0,0,0,0.06);
  border-top:0.5px solid rgba(255,255,255,0.8);
  will-change:transform;
}
.sheet.is-open{transform:translateY(0)}
.sheet-handle{
  width:40px;height:5px;border-radius:99px;
  background:rgba(120,120,128,0.3);
  margin:0 auto 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
}
.sheet-header{margin-bottom:16px}
.sheet-title{
  font-size:18px;font-weight:800;
  letter-spacing:-.025em;color:var(--label);
  margin-bottom:2px;line-height:1.25;
}
.sheet-sub{
  font-size:13px;color:var(--label-2);
  font-weight:600;letter-spacing:-.01em;
}
.sheet-actions{display:grid;gap:9px;margin-bottom:9px}
.sheet-btn{
  display:flex;align-items:center;gap:14px;
  padding:14px;border-radius:var(--radius-button);
  border:none;cursor:pointer;text-align:left;font-family:inherit;
  transition:transform .15s var(--spring),box-shadow .15s;
  position:relative;
}
.sheet-btn:active{transform:scale(.97)}
.sheet-btn-cash{
  background:linear-gradient(180deg,#31d977 0%,#25d366 100%);
  color:#fff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 4px 12px rgba(37,211,102,0.28);
}
.sheet-btn-cash:active{box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 2px 6px rgba(37,211,102,0.2)}
.sheet-btn-kredit{
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:var(--accent-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 4px 12px rgba(255,159,10,0.3);
}
.sheet-btn-kredit:active{box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 2px 6px rgba(255,159,10,0.22)}
.sheet-btn-icon{
  width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,0.22);
  display:grid;place-items:center;font-size:20px;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);
}
.sheet-btn-kredit .sheet-btn-icon{background:rgba(0,0,0,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.2)}
.sheet-btn-body{flex:1;min-width:0}
.sheet-btn-body strong{
  display:block;font-size:15px;font-weight:700;
  letter-spacing:-.015em;margin-bottom:1px;line-height:1.25;
}
.sheet-btn-body span{
  display:block;font-size:12.5px;opacity:0.9;
  line-height:1.35;letter-spacing:-.005em;
}
.sheet-cancel{
  width:100%;padding:14px;
  background:linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  border:0.5px solid rgba(0,0,0,0.04);
  color:var(--label-2);font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;
  border-radius:var(--radius-button);
  transition:transform .15s,background .15s;
  letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.8),0 1px 2px rgba(0,0,0,0.03);
}
.sheet-cancel:active{transform:scale(.97);background:var(--surface-2)}

/* ================= FOOTER & NOTFOUND ================= */
footer{
  text-align:center;padding:38px 0 18px;
  font-size:11.5px;color:var(--label-3);letter-spacing:-.005em;
}
.not-found{padding:70px 22px;text-align:center}
.not-found h2{
  font-size:20px;margin-bottom:10px;color:var(--label);
  letter-spacing:-.025em;
}
.not-found p{color:var(--label-2);margin-bottom:18px;font-size:14px}

/* ================= FALLBACK ================= */
@supports not ((backdrop-filter:blur(24px)) or (-webkit-backdrop-filter:blur(24px))){
  .section-head{background:rgba(242,242,247,0.98)}
  .detail-header{background:rgba(242,242,247,0.98)}
  .float-wa{background:var(--wa)}
  .sheet{background:var(--surface)}
  .sheet-backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}
  .model-img .tag{background:var(--accent)}
  .model-img .tag.tag-dark{background:var(--label)}
  .badge{background:rgba(255,255,255,.16)}
  .back-btn{background:var(--fill)}
}
</style>
</head>
<body>

<div id="app"></div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="actionSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-header">

    function renderRoute(route){
      if (!route || route === '/') return renderHome();
      if (route.indexOf('/model/') === 0) return renderModelDetail(route.slice(7));

    function makeScreen(route){
      var el = document.createElement('section');
      el.className = 'screen';
      el.setAttribute('data-route', route);
      el.innerHTML = renderRoute(route);
      var onScroll = function(){ if (!el.classList.contains('is-active')) return; updateFloatWa(el); };
      el.addEventListener('scroll', onScroll, { passive: true });
      el._onScroll = onScroll;
      setupStickyHeads(el);
      return el;
    }

    function pushScreen(route, animate){
      if (animate && animating) return;
      var current = stack[stack.length - 1];
      var el = makeScreen(route);
      app.appendChild(el);
      var afterActivate = function(){
        animating = false;
        updateFloatWa(el);
        if (pendingKreditModel && route === '/kredit') {
          var target = pendingKreditModel;
          pendingKreditModel = null;
          setTimeout(function(){ expandKreditModel(el, target); }, 120);
        }
      };
      if (animate && current) {
        animating = true;
        void el.offsetWidth;
        current.classList.remove('is-active');
        current.classList.add('is-behind');
        el.classList.add('is-active');
        setTimeout(afterActivate, NAV_DURATION);
      } else if (animate) {
        animating = true;
        el.classList.add('is-active');
        setTimeout(afterActivate, NAV_DURATION);
      } else {
        el.classList.add('no-transition', 'is-active');
        if (current) {
          current.classList.add('no-transition');
          current.classList.remove('is-active');
          current.classList.add('is-behind');
        }
        requestAnimationFrame(function(){
          el.classList.remove('no-transition');
          if (current) current.classList.remove('no-transition');
          afterActivate();
        });
      }
      stack.push(el);
    }

    function popScreen(animate){
      if (animate && animating) return;
      if (stack.length <= 1) return;
      var current = stack.pop();
      var prev = stack[stack.length - 1];
      if (animate) {
        animating = true;
        current.classList.remove('is-active');
        prev.classList.remove('is-behind');
        prev.classList.add('is-active');
        setTimeout(function(){
          if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
          current.remove();
          animating = false;
          updateFloatWa(prev);
        }, NAV_DURATION);
      } else {
        if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
        current.remove();
        prev.classList.remove('is-behind');
        prev.classList.add('is-active');
        updateFloatWa(prev);
      }
    }

    function popTo(index){
      if (index < 0 || index >= stack.length - 1) return;
      while (stack.length - 1 > index + 1) {
        var s = stack.pop();
        if (s._onScroll) s.removeEventListener('scroll', s._onScroll);
        s.remove();
      }
      popScreen(true);
    }

    function navigate(route){
      if (animating) return;
      var current = stack[stack.length - 1];
      if (current && current.getAttribute('data-route') === route) return;
      safePush(route);
      pushScreen(route, true);
    }

    function goBack(){
      if (animating) return;
      if (stack.length > 1) {
        if (historyOK) { try { history.back(); return; } catch (e) {} }
        popScreen(true);
        var prev = stack[stack.length - 1];
        if (prev) safeReplace(prev.getAttribute('data-route'));
        return;
      }
      var current = stack[0];
      if (current && current.getAttribute('data-route') !== '/') {
        var home = makeScreen('/');
        app.appendChild(home);
        home.classList.add('no-transition', 'is-active');
        current.classList.add('no-transition');
        current.classList.remove('is-active');
        current.classList.add('is-behind');
        requestAnimationFrame(function(){
          home.classList.remove('no-transition');
          current.classList.remove('no-transition');
          updateFloatWa(home);
        });
        stack.length = 0;
        stack.push(home);
        if (current._onScroll) current.removeEventListener('scroll', current._onScroll);
        current.remove();
        safeReplace('/');
      }
    }

    function refreshActiveList(prefix){
      var screen = stack[stack.length - 1];
      if (!screen) return;
      if (prefix === 'stok') {
        var c1 = screen.querySelector('#stok-list-container');
        if (c1) c1.innerHTML = renderStokList();
      } else if (prefix === 'kredit') {
        var c2 = screen.querySelector('#kredit-list-container');
        if (c2) c2.innerHTML = renderKreditCardsList();
      }
    }

    function handleSliderInput(slider){
      var card = slider.closest('.kredit-card');
      if (!card || card.classList.contains('promo-active')) return;
      var name = slider.getAttribute('data-model');
      var data = getModelData(name);
      if (!data) return;
      var opts = getSliderDpOptions(data);
      var idx = Math.max(0, Math.min(opts.length - 1, Number(slider.value)));
      var dp = opts[idx];
      var pct = opts.length > 1 ? (idx / (opts.length - 1)) * 100 : 0;
      slider.style.setProperty('--pct', pct + '%');
      var display = card.querySelector('[data-dp-value]');
      if (display) display.textContent = formatRp(dp);
      var tenorList = card.querySelector('[data-tenor-list]');
      if (tenorList) tenorList.innerHTML = renderTenorRows(name, dp);
      var promoContainer = card.querySelector('[data-promo-container]');
      if (promoContainer) {
        var triggerDp = getPromoTriggerDp(name);
        if (triggerDp !== null && dp === triggerDp) promoContainer.classList.add('is-visible');
        else promoContainer.classList.remove('is-visible');
      }
      resetSelection(card);
    }

    function handleSearchInput(input){
      var prefix = input.getAttribute('data-search');
      var val = input.value;
      if (prefix === 'stok') stokFilter.q = val;
      else if (prefix === 'kredit') kreditFilter.q = val;
      else return;
      refreshActiveList(prefix);
    }

    app.addEventListener('input', function(e){
      var t = e.target;
      if (t && t.closest && t.closest('[data-search]')) { handleSearchInput(t); return; }
      if (t && t.classList && t.classList.contains('dp-slider')) { handleSliderInput(t); return; }
    });

    app.addEventListener('click', function(e){
      if (animating) return;
      var target = e.target;

      var backEl = target.closest('[data-back]');
      if (backEl) { e.preventDefault(); goBack(); return; }

      var navEl = target.closest('[data-nav]');
      if (navEl) {
        e.preventDefault();
        var expand = navEl.getAttribute('data-expand-kredit');
        if (expand) pendingKreditModel = expand;
        navigate(navEl.getAttribute('data-nav'));
        return;
      }

      var msgEl = target.closest('[data-msg]');
      if (msgEl) { e.preventDefault(); openWa(msgEl.getAttribute('data-msg'), msgEl); return; }

      var stokEl = target.closest('.stok-item');
      if (stokEl) {
        e.preventDefault();
        var mname = stokEl.getAttribute('data-model');
        if (mname) openActionSheet(mname);
        return;
      }

      var toggleEl = target.closest('[data-toggle-kredit]');
      if (toggleEl) {
        e.preventDefault();
        var card = toggleEl.closest('.kredit-card');
        if (!card) return;
        var wasOpen = card.classList.contains('open');
        var parent = card.parentElement;
        if (parent) {
          var opened = parent.querySelectorAll('.kredit-card.open');
          for (var i = 0; i < opened.length; i++) if (opened[i] !== card) opened[i].classList.remove('open');
        }
        if (wasOpen) card.classList.remove('open');
        else card.classList.add('open');
        return;
      }

      var tenorEl = target.closest('.tenor-row');
      if (tenorEl) {
        e.preventDefault();
        var card2 = tenorEl.closest('.kredit-card');
        if (!card2 || card2.classList.contains('promo-active')) return;
        var dp = tenorEl.getAttribute('data-dp');
        var tenor = tenorEl.getAttribute('data-tenor');
        var cicilan = tenorEl.getAttribute('data-cicilan');
        if (!dp || !tenor || !cicilan) return;
        var rows = card2.querySelectorAll('.tenor-row');
        for (var j = 0; j < rows.length; j++) { rows[j].classList.remove('is-selected'); rows[j].setAttribute('aria-pressed', 'false'); }
        tenorEl.classList.add('is-selected');
        tenorEl.setAttribute('aria-pressed', 'true');
        card2.setAttribute('data-sel-dp', dp);
        card2.setAttribute('data-sel-tenor', tenor);
        card2.setAttribute('data-sel-cicilan', cicilan);
        updateKonsultasiBtn(card2);
        return;
      }

      var konsulEl = target.closest('[data-konsultasi]');
      if (konsulEl) {
        e.preventDefault();
        var card3 = konsulEl.closest('.kredit-card');
        if (!card3) return;
        openWa(buildKonsultasiMsg(card3), konsulEl);
        return;
      }

      var promoBtn = target.closest('[data-promo-toggle]');
      if (promoBtn) {
        e.preventDefault();
        var pname = promoBtn.getAttribute('data-promo-toggle');
        var card4 = promoBtn.closest('.kredit-card');
        if (!card4) return;
        var data = getModelData(pname);
        if (!data) return;
        var wasActive = card4.classList.contains('promo-active');
        var p = CONFIG.promo.beatSeries;
        if (!wasActive) {
          resetSelection(card4);
          card4.classList.add('promo-active');
          var disp = card4.querySelector('[data-dp-value]');
          if (disp) disp.innerHTML = formatRp(p.dp) + ' <small style="font-size:10px;color:#ff9f0a;font-weight:800;margin-left:4px">PROMO</small>';
          var sub = card4.querySelector('[data-dp-sub]');
          if (sub) sub.textContent = 'Mode Promo Aktif';
          updateKonsultasiBtn(card4);
        } else {
          card4.classList.remove('promo-active');
          var triggerDp = getPromoTriggerDp(pname);
          var opts = getSliderDpOptions(data);
          var targetDp = (triggerDp !== null && opts.indexOf(triggerDp) !== -1) ? triggerDp : getDefaultDp(pname);
          var targetIdx = opts.indexOf(targetDp);
          var slider = card4.querySelector('.dp-slider');
          if (slider && targetIdx >= 0) {
            slider.value = targetIdx;
            var pct = opts.length > 1 ? (targetIdx / (opts.length - 1)) * 100 : 0;
            slider.style.setProperty('--pct', pct + '%');
          }
          var disp2 = card4.querySelector('[data-dp-value]');
          if (disp2) disp2.textContent = formatRp(targetDp);
          var sub2 = card4.querySelector('[data-dp-sub]');
          if (sub2) sub2.textContent = 'Geser untuk ubah DP';
          var tenorList = card4.querySelector('[data-tenor-list]');
          if (tenorList) tenorList.innerHTML = renderTenorRows(pname, targetDp);
          var promoContainer = card4.querySelector('[data-promo-container]');
          if (promoContainer) {
            if (targetDp === triggerDp) promoContainer.classList.add('is-visible');
            else promoContainer.classList.remove('is-visible');
          }
          resetSelection(card4);
        }
        return;
      }

      var catEl = target.closest('[data-cat]');
      if (catEl) {
        e.preventDefault();
        var parts = catEl.getAttribute('data-cat').split(':');
        var prefix = parts[0];
        var cat = parts[1];
        var f = prefix === 'stok' ? stokFilter : kreditFilter;
        f.cat = cat;
        var tabs = catEl.parentElement;
        if (tabs) {
          var chips = tabs.querySelectorAll('.cat-chip');
          for (var k = 0; k < chips.length; k++) chips[k].classList.remove('is-active');
        }
        catEl.classList.add('is-active');
        refreshActiveList(prefix);
        return;
      }
    });

    var sheetCancel = document.getElementById('sheetCancel');
    if (sheetCancel) sheetCancel.addEventListener('click', closeActionSheet);
    if (sheetBackdrop) sheetBackdrop.addEventListener('click', closeActionSheet);

    var sheetActionBtns = document.querySelectorAll('[data-sheet-action]');
    for (var si = 0; si < sheetActionBtns.length; si++) {
      (function(btn){
        btn.addEventListener('click', function(){
          var name = pendingSheetModel;
          var action = btn.getAttribute('data-sheet-action');
          closeActionSheet();
          if (!name) return;
          if (action === 'cash') {
            openWa('Halo Dion, saya dari TikTok. Mau tanya harga cash & stok ' + name + '.', btn);
          } else if (action === 'kredit') {
            pendingKreditModel = name;
            navigate('/kredit');
          }
        });
      })(sheetActionBtns[si]);
    }

    if (floatWa) {
      floatWa.addEventListener('click', function(e){
        e.preventDefault();
        openWa(CONFIG.defaultMessage, null);
      });
    }

    window.addEventListener('popstate', function(){
      var route = hashToRoute(location.hash || '');
      var current = stack[stack.length - 1];
      if (current && current.getAttribute('data-route') === route) return;
      var idx = -1;
      for (var i = 0; i < stack.length; i++) if (stack[i].getAttribute('data-route') === route) { idx = i; break; }
      if (idx >= 0 && idx < stack.length - 1) popTo(idx);
      else pushScreen(route, true);
    });

    var initialRoute = hashToRoute(location.hash || '');
    if (!initialRoute || initialRoute.charAt(0) !== '/') initialRoute = '/';

    try { history.replaceState({ route: '/' }, '', '#/'); historyOK = true; } catch (e) { historyOK = false; }

    try {
      pushScreen('/', false);
    } catch (err) {
      app.innerHTML = '<div style="padding:48px 24px;font-family:-apple-system,sans-serif;color:#1c1c1e;line-height:1.5"><h2 style="font-size:20px;margin-bottom:8px">Gagal memuat halaman</h2><p style="color:#6b6b70;font-size:14px">' + esc(String((err && err.message) || err)) + '</p></div>';
      return;
    }

    if (initialRoute !== '/') {
      try { safePush(initialRoute); pushScreen(initialRoute, false); } catch (e2) {}
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
